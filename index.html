      <label>Год смерти <span class="hint">пусто = жив(а)</span><input name="died" type="number" value="${esc(c.died || '')}"></label>

      <label class="full">Фотография
        <div class="photo-row">
          <div class="photo-prev" id="photoPrev">${c.photo ? `<img src="${esc(c.photo)}">` : 'нет фото'}</div>
          <div class="photo-fields">
            <input name="photo" value="${esc(c.photo)}" placeholder="images/irma.jpg или URL">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <button type="button" class="btn-add" id="photoPick" style="padding:5px 12px;font-size:12px">Выбрать файл…</button>
              <button type="button" id="photoClear" style="padding:5px 12px;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:9px;cursor:pointer">Убрать</button>
              <input type="file" id="photoFile" accept="image/*" hidden>
              <span class="hint" id="photoSize"></span>
            </div>
          </div>
        </div>
      </label>

      <label class="full">Короткая строка (tagline)<input name="tagline" value="${esc(c.tagline)}"></label>
      <label class="full">Теги <span class="hint">через запятую</span>
        <input name="tags" value="${esc((c.tags || []).join(', '))}"></label>

      <label class="full">Страны <span class="hint">отметьте те, где жил(а)</span>
        <div class="checks">
          ${countryEntries.map(([code, co]) => `
            <label><input type="checkbox" name="country" value="${esc(code)}"
              ${(c.countries || []).includes(code) ? 'checked' : ''}>
              ${co.flag} ${esc(co.name)}</label>`).join('')}
        </div>
      </label>

      <label class="full">Биография<textarea name="bio">${esc(c.bio)}</textarea></label>
      <label class="full">Цитата<textarea name="quote" style="min-height:56px">${esc(c.quote)}</textarea></label>
      <label class="full">Черты <span class="hint">по одной в строке, формат «Название: число»</span>
        <textarea name="traits" style="min-height:90px">${esc(traitsStr)}</textarea></label>
      <label class="full">Тайна (спойлер)<textarea name="secret">${esc(c.secret)}</textarea></label>
        <label class="full">Связи
        <div class="rel-edit-list" id="relBox"></div>
        <button type="button" class="rel-add-btn" id="relAdd">+ Добавить связь</button>
      </label>
      </div>

    <div class="form-actions">
      ${!isNew ? `<button class="del" type="button" id="ff-del">Удалить персонажа</button>` : ''}
      <button type="button" onclick="closeForm()">Отмена</button>
      <button class="primary" type="button" id="ff-save">Сохранить</button>
    </div>
  `;

  /* фото */
  const photoInput = $('#formSheet [name=photo]');
  const photoPrev = $('#photoPrev');
  const photoSize = $('#photoSize');

  function updatePhotoPreview(){
    const v = photoInput.value.trim();
    photoPrev.innerHTML = v ? `<img src="${esc(v)}" onerror="this.parentNode.textContent='ошибка'">` : 'нет фото';
    if (v.startsWith('data:')){
      const kb = Math.round(v.length * 0.75 / 1024);
      photoSize.textContent = `≈${kb} КБ в data.json`;
      photoSize.style.color = kb > 150 ? 'var(--danger)' : 'var(--ok)';
    } else photoSize.textContent = '';
  }
  photoInput.oninput = updatePhotoPreview;
  updatePhotoPreview();

  $('#photoPick').onclick = () => $('#photoFile').click();
  $('#photoFile').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    if (f.size > 1024*1024 && !confirm(`Файл ${Math.round(f.size/1024)} КБ. В data.json он займёт больше мегабайта. Продолжить?`)) return;
    const r = new FileReader();
    r.onload = () => { photoInput.value = r.result; updatePhotoPreview(); };
    r.readAsDataURL(f);
    ev.target.value = '';
  };
  $('#photoClear').onclick = () => { photoInput.value = ''; updatePhotoPreview(); };

  /* ============================================================
     Редактор связей
     ============================================================ */
  const relBox = $('#relBox');
  const otherChars = DB.characters
    .filter(x => x.id !== c.id)
    .sort((a,b) => a.name.localeCompare(b.name, 'ru'));

  /* загружаем существующие связи в формате «с точки зрения c» */
  const formRels = [];
  DB.relations
    .filter(r => r.a === c.id || r.b === c.id)
    .forEach(r => {
      if (r.t === 'родитель'){
        if (r.a === c.id) formRels.push({ other: r.b, type: 'родитель', label: r.label || '' });
        else              formRels.push({ other: r.a, type: 'ребёнок',  label: r.label || '' });
      } else {
        const other = r.a === c.id ? r.b : r.a;
        formRels.push({ other, type: r.t, label: r.label || '' });
      }
    });

  const REL_TYPES = {
    'родитель': 'я — родитель',
    'ребёнок':  'я — ребёнок',
    'супруг':   'супруг(а)',
    'брат':     'брат / сестра'
  };

  function renderRels(){
    if (!otherChars.length){
      relBox.innerHTML = `<p style="font-size:13px;color:var(--dim);font-style:italic">Других персонажей пока нет — связи появятся, когда заведёте второго.</p>`;
      $('#relAdd').hidden = true;
      return;
    }
    $('#relAdd').hidden = false;

    if (!formRels.length){
      relBox.innerHTML = `<p style="font-size:13px;color:var(--dim);font-style:italic">Связей пока нет. Нажмите «Добавить связь».</p>`;
      return;
    }

    relBox.innerHTML = formRels.map((r, i) => {
      const current = r.other ? otherChars.find(x => x.id === r.other) : null;
      return `<div class="rel-edit-row" data-i="${i}">
        <select data-f="type">
          ${Object.entries(REL_TYPES).map(([k,v]) =>
            `<option value="${esc(k)}" ${r.type === k ? 'selected' : ''}>${esc(v)}</option>`
          ).join('')}
        </select>
        <div class="ac">
          <input type="text" class="ac-input" placeholder="Имя персонажа…"
                 value="${current ? esc(current.name) : ''}"
                 autocomplete="off">
          <div class="ac-list" hidden></div>
        </div>
        <input data-f="label" placeholder="подпись (жена, мать…)" value="${esc(r.label)}">
        <button type="button" class="rel-edit-del" title="Удалить связь">✕</button>
      </div>`;
    }).join('');

    relBox.querySelectorAll('.rel-edit-row').forEach(row => {
      const i = +row.dataset.i;

      row.querySelector('[data-f=type]').onchange = e => { formRels[i].type = e.target.value; };
      row.querySelector('[data-f=label]').oninput = e => { formRels[i].label = e.target.value; };
      row.querySelector('.rel-edit-del').onclick = () => {
        formRels.splice(i, 1);
        renderRels();
      };

      const acInput = row.querySelector('.ac-input');
      const acList  = row.querySelector('.ac-list');
      let activeIdx = -1;

      function closeAc(){ acList.hidden = true; acList.innerHTML = ''; activeIdx = -1; }

      function openAc(query){
        const q = (query || '').toLowerCase().trim();
        const filtered = !q
          ? otherChars.slice(0, 12)
          : otherChars.filter(x =>
              x.name.toLowerCase().includes(q) ||
              (x.alias || '').toLowerCase().includes(q)
            ).slice(0, 12);

        if (!filtered.length){
          acList.innerHTML = `<div class="ac-empty">Ничего не найдено</div>`;
          acList.hidden = false;
          return;
        }
        acList.innerHTML = filtered.map(x => `
          <div class="ac-item" data-id="${esc(x.id)}" data-name="${esc(x.name)}">${esc(x.name)}</div>
        `).join('');
        acList.hidden = false;
        activeIdx = -1;

        acList.querySelectorAll('.ac-item').forEach(it => {
          it.onmousedown = e => {
            e.preventDefault();
            formRels[i].other = it.dataset.id;
            acInput.value = it.dataset.name;
            closeAc();
          };
        });
      }

      acInput.onfocus = () => openAc(acInput.value);
      acInput.oninput = () => {
        formRels[i].other = '';
        openAc(acInput.value);
      };
      acInput.onblur = () => {
        setTimeout(() => {
          const v = acInput.value.trim().toLowerCase();
          if (!formRels[i].other && v){
            const found = otherChars.find(x => x.name.toLowerCase() === v);
            if (found) formRels[i].other = found.id;
          }
          closeAc();
        }, 120);
      };
      acInput.onkeydown = e => {
        const items = [...acList.querySelectorAll('.ac-item')];
        if (!items.length) return;
        if (e.key === 'ArrowDown'){
          e.preventDefault();
          activeIdx = Math.min(items.length - 1, activeIdx + 1);
          items.forEach((it, k) => it.classList.toggle('active', k === activeIdx));
          items[activeIdx].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp'){
          e.preventDefault();
          activeIdx = Math.max(0, activeIdx - 1);
          items.forEach((it, k) => it.classList.toggle('active', k === activeIdx));
          items[activeIdx].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter'){
          if (activeIdx >= 0){
            e.preventDefault();
            const it = items[activeIdx];
            formRels[i].other = it.dataset.id;
            acInput.value = it.dataset.name;
            closeAc();
          }
        } else if (e.key === 'Escape'){
          closeAc();
        }
      };
    });
  }

  $('#relAdd').onclick = () => {
    formRels.push({ other: '', type: 'супруг', label: '' });
    renderRels();
    /* прокрутим к последней строке */
    setTimeout(() => {
      const last = relBox.querySelector('.rel-edit-row:last-child');
      if (last) last.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 50);
  };

  renderRels();

  /* сохранение */
  $('#ff-save').onclick = () => {
    const get = n => $('#formSheet [name=' + n + ']').value.trim();
    const name = get('name');
    if (!name){ alert('Имя не может быть пустым'); return; }

    const traits = {};
    get('traits').split('\n').forEach(line => {
      const m = line.match(/^(.+?)\s*:\s*(-?\d+)\s*$/);
      if (m) traits[m[1].trim()] = +m[2];
    });

    const bornRaw = get('born');
    const diedRaw = get('died');
    const patch = {
      name, alias: get('alias'), faction: get('faction'), role: get('role'),
      status: get('status'), gender: get('gender'), tagline: get('tagline'), photo: get('photo'),
      bornInto: get('bornInto'),
      born: bornRaw === '' ? null : +bornRaw,
      died: diedRaw === '' ? null : +diedRaw,
      tags: get('tags').split(',').map(s => s.trim()).filter(Boolean),
      countries: [...$('#formSheet').querySelectorAll('[name=country]:checked')].map(x => x.value),
      bio: get('bio'), quote: get('quote'), traits, secret: get('secret')
    };

       if (isNew) DB.characters.push({ ...c, ...patch });
    else Object.assign(byId(id), patch);

    /* --- сохраняем связи --- */
    /* 1. Удаляем все связи, где участвует этот персонаж */
    DB.relations = DB.relations.filter(r => r.a !== c.id && r.b !== c.id);

    /* 2. Добавляем заново из формы */
    formRels.forEach(r => {
      if (!r.other || r.other === c.id) return;
      if (r.type === 'родитель'){
        DB.relations.push({ a: c.id, b: r.other, t: 'родитель', label: r.label });
      } else if (r.type === 'ребёнок'){
        DB.relations.push({ a: r.other, b: c.id, t: 'родитель', label: r.label });
      } else if (r.type === 'супруг' || r.type === 'брат'){
        /* не создаём дубль, если такая же связь уже есть в обратную сторону */
        const dup = DB.relations.some(x =>
          x.t === r.type &&
          ((x.a === c.id && x.b === r.other) || (x.a === r.other && x.b === c.id))
        );
        if (!dup) DB.relations.push({ a: c.id, b: r.other, t: r.type, label: r.label });
      }
    });

    touch();
    closeForm();
    renderAll();
  };

  const delBtn = $('#ff-del');
  if (delBtn) delBtn.onclick = () => { closeForm(); confirmDeleteChar(id); };

  $('#formModal').classList.add('on');
}
function closeForm(){ $('#formModal').classList.remove('on'); }
$('#formModal').onclick = e => { if (e.target.id === 'formModal') closeForm(); };

function confirmDeleteChar(id){
  const c = byId(id); if (!c) return;
  const linked = DB.relations.filter(r => r.a === id || r.b === id).length;
  const inEvents = DB.events.filter(e => (e.cast || []).includes(id)).length;
  if (!confirm(`Удалить «${c.name}»?\n\nСвязей будет удалено: ${linked}\nУпоминаний в событиях: ${inEvents}`)) return;
  DB.characters = DB.characters.filter(x => x.id !== id);
  DB.relations  = DB.relations.filter(r => r.a !== id && r.b !== id);
  DB.events.forEach(e => { e.cast = (e.cast || []).filter(x => x !== id); });
  touch(); renderAll();
}

function openEventForm(i){
  const isNew = i == null;
  const e = isNew
    ? { year: viewYear, title:'', text:'', cast:[] }
    : DB.events[i];

  const chars = [...DB.characters].sort((a,b) => a.name.localeCompare(b.name, 'ru'));
  const castSet = new Set(e.cast || []);

  $('#formSheet').innerHTML = `
    <button class="close" onclick="closeForm()">✕</button>
    <h2 style="margin-top:0">${isNew ? 'Новое событие' : 'Редактирование события'}</h2>

    <div class="fgrid">
      <label>Год<input name="year" type="number" value="${esc(e.year)}"></label>
      <label>Название<input name="title" value="${esc(e.title)}"></label>
      <label class="full">Описание<textarea name="text" style="min-height:110px">${esc(e.text)}</textarea></label>
      <label class="full">Участники
        <div class="picker" id="castBox"></div>
      </label>
            <label class="full">Локация
        <select name="location">
          <option value="">— не указана —</option>
          ${(DB.locations || []).map(l => `<option value="${esc(l.id)}" ${e.location === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}
        </select>
      </label>
    </div>

    <div class="form-actions">
      ${!isNew ? `<button class="del" type="button" id="ef-del">Удалить событие</button>` : ''}
      <button type="button" onclick="closeForm()">Отмена</button>
      <button class="primary" type="button" id="ef-save">Сохранить</button>
    </div>
  `;

    const castPicker = setupPicker(
    $('#castBox'),
    chars.map(c => ({ id: c.id, name: c.name })),
    castSet
  );

  $('#ef-save').onclick = () => {
    const get = n => $('#formSheet [name=' + n + ']').value.trim();
    const title = get('title');
    if (!title){ alert('Название не может быть пустым'); return; }
    const cast = [...$('#castBox').querySelectorAll('input:checked')].map(x => x.value);
    const patch = {
      year: +get('year') || 0, title, text: get('text'), cast,
      location: $('#formSheet [name=location]').value || null
    };
    if (isNew) DB.events.push(patch);
    else Object.assign(DB.events[i], patch);
    touch(); closeForm(); renderTimeline(); renderLifelines();
  };

  const d = $('#ef-del');
  if (d) d.onclick = () => {
    if (!confirm('Удалить событие «' + e.title + '»?')) return;

  };

  $('#formModal').classList.add('on');
}

/* ============================================================

   ============================================================ */
function llRange(){
  const borns = DB.characters.map(c => c.born).filter(x => x != null);
  const dieds = DB.characters.map(c => c.died).filter(x => x != null);
  const evs   = DB.events.map(e => e.year);
  const all   = [...borns, ...dieds, ...evs];
  if (DB.meta?.currentYear) all.push(DB.meta.currentYear);
  if (!all.length) return { minY: 0, maxY: 100 };
  return { minY: Math.min(...all) - 2, maxY: Math.max(...all) + 8 };
}

function bindYearControls(){
  const { minY, maxY } = llRange();
  const range = $('#llYearRange');
  if (!range) return;
  range.min = minY; range.max = maxY;
  range.value = viewYear;

  const valEl = $('#llYearVal');
  if (valEl) valEl.textContent = viewYear;

  const eventYears = [...new Set(DB.events.map(e => e.year))].sort((a,b) => a - b);
  const jump = $('#llJump');
  if (jump){
    jump.innerHTML = eventYears.map(y =>
      `<button data-y="${y}" class="${y === viewYear ? 'on' : ''}">${y}</button>`
    ).join('');
    $$('#llJump button').forEach(b => b.onclick = () => setViewYear(+b.dataset.y));
  }

  range.oninput = e => setViewYear(+e.target.value);

  const val = $('#llYearVal');
  if (!val) return;   /* сейчас открыт input — обработчик навесится при следующем рендере */

  val.onclick = () => {
    const input = document.createElement('input');
    input.type = 'number'; input.className = 'year-input';
    input.value = viewYear; input.min = minY; input.max = maxY;
    val.replaceWith(input); input.focus(); input.select();

    /* защита от двойного срабатывания: Enter вызывает commit, следом blur — тоже commit */
    let done = false;

    const restoreSpan = (text) => {
      const span = document.createElement('span');
      span.className = 'year-val';
      span.id = 'llYearVal';
      span.textContent = text;
      input.replaceWith(span);
    };

    const commit = () => {
      if (done) return;
      done = true;
      const y = Math.max(minY, Math.min(maxY, +input.value || viewYear));
      restoreSpan(y);
      setViewYear(y);
    };

    const cancel = () => {
      if (done) return;
      done = true;
      restoreSpan(viewYear);
      /* возвращаем интерактивность: span новый, обработчика на нём нет */
      renderLifelines();
    };

    input.onblur = commit;
    input.onkeydown = e => {
      if (e.key === 'Enter'){ e.preventDefault(); commit(); }
      if (e.key === 'Escape'){ e.preventDefault(); cancel(); }
    };
  };
}

/* ============================================================
   Сравнение возрастов
   ============================================================ */
function renderComparePanel(){
  const box = $('#llCompare');
  const order = [...compareIds].map(id => byId(id)).filter(Boolean);

  if (order.length < 2){ box.hidden = true; box.innerHTML = ''; return; }

  const ages = order.map(c => {
    const a = ageLabel(c, viewYear);
    const n = parseInt(a.text.replace(/[^\d-]/g, ''), 10);
    return { c, age: a, num: isNaN(n) ? null : n };
  });

  const maxAge = Math.max(1, ...ages.filter(x => x.num != null).map(x => x.num));

   /* все пары: 1↔2, 1↔3, 2↔3, 1↔4, 2↔4, 3↔4… */
  const pairs = [];
  for (let i = 0; i < ages.length; i++){
    for (let j = i + 1; j < ages.length; j++){
      pairs.push([ages[i], ages[j], i, j]);
    }
  }

  box.hidden = false;
  box.innerHTML = `
    <div class="ll-compare">
      <div class="ll-compare-head">
        <b>Сравнение возрастов</b>
        <span class="ll-compare-hint">на ${viewYear} год · по порядку отметки</span>
        <button type="button" id="llCompareClear">Очистить</button>
      </div>

      <div class="ll-compare-list">
        ${ages.map(({c, age, num}) => {
          const col = factionColor(c);
          const pct = num == null ? 0 : Math.round((num / maxAge) * 100);
          return `<div class="ll-compare-row">
            <div class="ll-compare-name" title="${esc(c.name)}">${esc(c.name)}</div>
            <div class="ll-compare-bar"><i style="width:${pct}%;background:${col}"></i></div>
            <div class="ll-compare-age">${esc(age.text)}</div>
            <div class="ll-compare-born">${c.born}${c.died ? '–' + c.died : ''}</div>
          </div>`;
        }).join('')}
      </div>

      <div class="ll-compare-pairs">
          ${pairs.map(([a, b, i, j]) => {
          const aCol = factionColor(a.c);
          const bCol = factionColor(b.c);
          let diffHTML;

          if (a.num == null || b.num == null){
            diffHTML = `<span style="color:var(--dim)">сравнить нельзя</span>`;
          } else {
            const d = a.num - b.num;
            const abs = Math.abs(d);
            const word = plural(abs, 'год', 'года', 'лет');
            if (d === 0){
              diffHTML = `<span style="color:var(--dim)">ровесники</span>`;
            } else if (d > 0){
              diffHTML = `<span style="color:${aCol}">${esc(a.c.name)}</span> старше на <b>${abs}</b> ${word}`;
            } else {
              diffHTML = `<span style="color:${bCol}">${esc(b.c.name)}</span> старше на <b>${abs}</b> ${word}`;
            }
          }

          return `<div class="ll-compare-pair">
            <div class="ll-compare-pair-num">${i + 1}↔${j + 1}</div>
            <div class="ll-compare-pair-chain">
              <span style="color:${aCol}">${esc(a.c.name)}</span>
              <span class="pc-arrow">→</span>
              <span style="color:${bCol}">${esc(b.c.name)}</span>
            </div>
            <div class="ll-compare-pair-diff">${diffHTML}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
  return many;
}

function renderLifelines(){
  if (llMode !== 'lives') return;

    /* ширина колонки имён: сохранённая или автоматическая */

  if (savedW){
    $('#lifelines').style.setProperty('--ll-label-w', (+savedW) + 'px');

    /* авто — по самому длинному имени среди всех персонажей */

    const ctx = canvas.getContext('2d');
    ctx.font = '500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    let maxText = 0;
    DB.characters.forEach(c => {
      const w = ctx.measureText(c.name || '').width;
      if (w > maxText) maxText = w;
    });
    /* запас: чекбокс(22) + аватар(22) + флаг(36) + возраст(52) + отступы(40) */
    const auto = Math.max(260, Math.min(560, Math.ceil(maxText) + 172));
    $('#lifelines').style.setProperty('--ll-label-w', auto + 'px');
  }
  const usedCountries = [...new Set(DB.characters.flatMap(c => c.countries || []))];
  const orderedCountries = Object.keys(DB.countries || {}).filter(k => usedCountries.includes(k));
  const chips = ['Все', ...orderedCountries];
  if (!chips.includes(llCountryFilter)) llCountryFilter = 'Все';
    $('#llCountries').innerHTML = chips.map(code => {
    const inner = code === 'Все'
      ? 'Все страны'
      : `<img class="chip-flag" src="https://flagcdn.com/w40/${esc(code)}.png" title="${esc(countryOf(code).name)}">`;
    return `<div class="chip ${code === llCountryFilter ? 'on' : ''}" data-c="${esc(code)}">${inner}</div>`;
  }).join('');
  $$('#llCountries .chip').forEach(ch => ch.onclick = () => {
    llCountryFilter = ch.dataset.c; renderLifelines();
  });

  bindYearControls();

  const { minY, maxY } = llRange();
  const span = maxY - minY;
  const trackW = Math.ceil(span * llPxPerYear) + 60;
  const xOf = y => (y - minY) * llPxPerYear + 30;

  const q = $('#llSearch').value.trim().toLowerCase();

  let rows = DB.characters
    .filter(c => c.born != null)
    .filter(c => !q || c.name.toLowerCase().includes(q) || (c.alias||'').toLowerCase().includes(q))
    .filter(c => llCountryFilter === 'Все' || (c.countries || []).includes(llCountryFilter))
    .sort((a, b) => a.born - b.born || a.name.localeCompare(b.name, 'ru'));

  if (!rows.length){
    $('#lifelines').innerHTML = `<div class="ll-empty">Нет персонажей с датой рождения под такие фильтры.</div>`;
    return;
  }

  const step = llPxPerYear < 12 ? 25 : llPxPerYear < 20 ? 10 : 5;
  const nowX = xOf(viewYear);
  let ticks = '';
  for (let y = Math.ceil(minY/step)*step; y <= maxY; y += step){
    const x = xOf(y);
    const cls = 'tick' + (y === viewYear ? ' now' : '');
    ticks += `<div class="${cls}" style="left:${x}px">${y}</div>`;
  }

    const header = `<div class="ll-header">
    <div class="ll-label-col">Персонаж<span class="ll-resizer" id="llResizer" title="Потяните, чтобы изменить ширину. Двойной клик — сбросить."></span></div>
    <div class="ll-scale" style="width:${trackW}px">
      ${ticks}
      <div class="ll-now" style="left:${nowX}px"></div>
    </div>
  </div>`;

  const rowsHTML = rows.map(c => {
    const col = factionColor(c);
    const photo = c.photo ? `<img src="${esc(c.photo)}" onerror="this.remove()">` : initials(c.name);
    const born = c.born;
    const deathYear = c.died || viewYear;
    const showBar = born <= viewYear;
    const barStart = xOf(born);
    const barEnd = xOf(Math.min(deathYear, maxY));
    const barW = Math.max(0, barEnd - barStart);

    let barHTML = '';
    if (showBar && barW > 0){
      if (c.died && c.died < viewYear){
        const xDie = xOf(c.died);
        const aliveW = Math.max(0, xDie - barStart);
        const deadW = Math.max(0, barEnd - xDie);
        barHTML += `<div class="ll-bar" style="left:${barStart}px; width:${aliveW}px; background:${col}"></div>`;
        barHTML += `<div class="ll-bar dead-seg" style="left:${xDie}px; width:${deadW}px"></div>`;
      } else {
        barHTML += `<div class="ll-bar" style="left:${barStart}px; width:${barW}px; background:${col}"></div>`;
      }
    }

    const seen = new Set();
    const dots = DB.events
      .filter(e => (e.cast||[]).includes(c.id) && e.year <= viewYear)
      .map(e => e.year)
      .filter(y => { if (seen.has(y)) return false; seen.add(y); return true; })
      .map(y => {
        const titles = DB.events.filter(e => e.year === y && (e.cast||[]).includes(c.id))
          .map(e => e.title).join(' · ');
        return `<div class="ll-dot" style="left:${xOf(y)}px; background:${col};"
          data-name="${esc(c.name)}" data-year="${y}" data-evs="${esc(titles)}"></div>`;
      }).join('');

    const age = ageLabel(c, viewYear);
    const rowCls = 'll-row' + (c.born > viewYear ? ' unborn' : '');

        const picked = compareIds.has(c.id);
    return `<div class="${rowCls}${picked ? ' picked' : ''}" data-id="${c.id}">
      <div class="ll-label-col" style="--c:${col}">
        <input type="checkbox" class="ll-pin" data-cid="${c.id}" ${picked ? 'checked' : ''} title="Отметить для сравнения">
        <div class="ll-avatar">${photo}</div>
        <div class="ll-name" title="${esc(c.name)} (${born}${c.died ? '–' + c.died : ''})">${esc(c.name)}</div>
        <div class="ll-flags">${flagsHTML(c.countries)}</div>
        <div class="ll-age ${age.cls}">${age.text}</div>
      </div>
      <div class="ll-track" style="width:${trackW}px">
        ${barHTML}
        ${dots}
        <div class="ll-now" style="left:${nowX}px"></div>
      </div>
    </div>`;
  }).join('');

  $('#lifelines').innerHTML = header + rowsHTML;

    $$('#lifelines .ll-row .ll-label-col').forEach(el => {
    el.onclick = ev => {
      if (ev.target.classList.contains('ll-pin')) return;
      openChar(el.parentElement.dataset.id);
    };
  });

  $$('#lifelines .ll-pin').forEach(cb => {
    cb.onclick = ev => ev.stopPropagation();
    cb.onchange = () => {
      if (cb.checked) compareIds.add(cb.dataset.cid);
      else compareIds.delete(cb.dataset.cid);
      const row = cb.closest('.ll-row');
      row.classList.toggle('picked', cb.checked);
      renderComparePanel();
    };
  });

  let tip = document.querySelector('.ll-tip');
  if (!tip){
    tip = document.createElement('div');
    tip.className = 'll-tip';
    document.body.appendChild(tip);
  }
  $$('#lifelines .ll-dot').forEach(dot => {
    dot.addEventListener('mouseenter', () => {
      tip.innerHTML = `<b>${esc(dot.dataset.year)}</b> · ${esc(dot.dataset.name)}<br>${esc(dot.dataset.evs)}`;
      tip.classList.add('on');
    });
    dot.addEventListener('mousemove', ev => {
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top  = (ev.clientY + 14) + 'px';
    });
    dot.addEventListener('mouseleave', () => tip.classList.remove('on'));
  });

    /* ============================================================
     Ресайз колонки имён
     ============================================================ */
  const resizer = $('#llResizer');
  if (resizer){
    let startX = 0, startW = 0, dragging = false;

    resizer.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      resizer.classList.add('dragging');
      startX = e.clientX;
      startW = parseInt(getComputedStyle($('#lifelines')).getPropertyValue('--ll-label-w')) || 290;
      resizer.setPointerCapture(e.pointerId);
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    resizer.addEventListener('pointermove', e => {
      if (!dragging) return;
      const w = Math.max(120, Math.min(700, startW + (e.clientX - startX)));
      $('#lifelines').style.setProperty('--ll-label-w', w + 'px');
    });

    resizer.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      resizer.releasePointerCapture(e.pointerId);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      const w = parseInt(getComputedStyle($('#lifelines')).getPropertyValue('--ll-label-w'));
      if (w) localStorage.setItem(LL_WIDTH_KEY, String(w));
    });

    resizer.addEventListener('dblclick', () => {
      localStorage.removeItem(LL_WIDTH_KEY);
      renderLifelines();
    });
  }
}

/* ============================================================
   Древо семей
   ============================================================ */
let treeMode = 'all';
let treeSearch = '';
let treeOnlyMatches = false;

const TREE_COL_W = 200, TREE_ROW_H = 230, TREE_PAD = 12, TREE_NODE_H = 56;

/* ============================================================
   Древо: строим секции по связным компонентам родства
   ============================================================ */
function buildTreeClusters(){
  const RELS = ['родитель', 'супруг', 'брат'];
  const rels = (DB.relations || []).filter(r => RELS.includes(r.t));

  /* union-find по персонажам */
  const parent = {};
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  const union = (a, b) => { parent[find(a)] = find(b); };

  DB.characters.forEach(c => { parent[c.id] = c.id; });
  rels.forEach(r => {
    if (parent[r.a] != null && parent[r.b] != null) union(r.a, r.b);
  });

  /* группируем по корню */
  const groups = {};
  DB.characters.forEach(c => {
    const root = find(c.id);
    (groups[root] = groups[root] || []).push(c);
  });

  /* превращаем в массив кластеров */
  const clusters = [];
  Object.values(groups).forEach(members => {
    if (members.length < 2) return;   /* одиночек вынесем отдельно */
    const bloodCount = {};
    members.forEach(m => {
      const key = m.bornInto || '_';
      bloodCount[key] = (bloodCount[key] || 0) + 1;
    });
    const domBlood = Object.entries(bloodCount).sort((a,b) => b[1] - a[1])[0][0];
    const fam = (DB.families || []).find(f => f.id === domBlood);
    clusters.push({
      members,
      famId: domBlood,
      famName: fam ? fam.name : 'Без рода',
      famColor: fam ? fam.color : '#8b98ab'
    });
  });

  /* сортируем кластеры по размеру (крупные — первыми) */
  clusters.sort((a, b) => b.members.length - a.members.length);

  return clusters;
}

/* ============================================================
   Глобальный расчёт поколений для всех персонажей
   ============================================================ */
function computeGlobalGenerations(){
  const RELS = ['родитель', 'супруг', 'брат'];
  const rels = (DB.relations || []).filter(r => RELS.includes(r.t));
  const parentEdges = rels.filter(r => r.t === 'родитель');
  const spouseEdges = rels.filter(r => r.t === 'супруг');

  const gen = {};
  const parentsOf = {};
  DB.characters.forEach(c => parentsOf[c.id] = []);
  parentEdges.forEach(e => { if (parentsOf[e.b]) parentsOf[e.b].push(e.a); });

  DB.characters.forEach(c => { if (!parentsOf[c.id].length) gen[c.id] = 0; });

  let changed = true, safety = 0;
  while (changed && safety++ < 60){
    changed = false;
    parentEdges.forEach(e => {
      if (gen[e.a] == null) return;
      const want = gen[e.a] + 1;
      if (gen[e.b] == null || gen[e.b] < want){ gen[e.b] = want; changed = true; }
    });
  }
  DB.characters.forEach(c => { if (gen[c.id] == null) gen[c.id] = 0; });

  /* супруг без родителей подтягивается к уровню своей половины */
  let moved = true, guard = 0;
  while (moved && guard++ < 30){
    moved = false;
    spouseEdges.forEach(e => {
      const aHasParents = parentEdges.some(pe => pe.b === e.a);
      const bHasParents = parentEdges.some(pe => pe.b === e.b);
      if (!aHasParents && bHasParents && gen[e.a] !== gen[e.b]){ gen[e.a] = gen[e.b]; moved = true; }
      else if (aHasParents && !bHasParents && gen[e.a] !== gen[e.b]){ gen[e.b] = gen[e.a]; moved = true; }
    });
    if (moved){
      parentEdges.forEach(e => {
        if (gen[e.a] == null) return;
        const want = gen[e.a] + 1;
        if (gen[e.b] == null || gen[e.b] < want){ gen[e.b] = want; moved = true; }
      });
    }
  }

  return gen;
}

/* Секция «Вне семей» — те, у кого нет ни одной родственной связи */
function buildOrphans(){
  const RELS = ['родитель', 'супруг', 'брат'];
  const linked = new Set();
  (DB.relations || []).filter(r => RELS.includes(r.t)).forEach(r => {
    linked.add(r.a);
    linked.add(r.b);
  });
  return DB.characters.filter(c => !linked.has(c.id));
}

/* --- вычисление раскладки для набора персонажей --- */
function computeLayout(members, famColor, inlawIds){
  const ids = new Set(members.map(m => m.id));
  const parentEdges = DB.relations.filter(r => r.t === 'родитель' && ids.has(r.a) && ids.has(r.b));
  const spouseEdges = DB.relations.filter(r => r.t === 'супруг'   && ids.has(r.a) && ids.has(r.b));

  const gen = {};
  const parentsOf = {}; members.forEach(m => parentsOf[m.id] = []);
  parentEdges.forEach(e => parentsOf[e.b].push(e.a));
  members.forEach(m => { if (!parentsOf[m.id].length) gen[m.id] = 0; });
  let changed = true, safety = 0;
  while (changed && safety++ < 60){
    changed = false;
    parentEdges.forEach(e => {
      if (gen[e.a] == null) return;
      const want = gen[e.a] + 1;
      if (gen[e.b] == null || gen[e.b] < want){ gen[e.b] = want; changed = true; }
    });
  }
  members.forEach(m => { if (gen[m.id] == null) gen[m.id] = 0; });

    /* супруг без родителей подтягивается к уровню своей половины */
  let moved = true, guard = 0;
  while (moved && guard++ < 30){
    moved = false;
    spouseEdges.forEach(e => {
      const aHasParents = parentEdges.some(pe => pe.b === e.a);
      const bHasParents = parentEdges.some(pe => pe.b === e.b);

      /* только один из двоих — «пришлый» */
      if (!aHasParents && bHasParents && gen[e.a] !== gen[e.b]){
        gen[e.a] = gen[e.b];
        moved = true;
      } else if (aHasParents && !bHasParents && gen[e.a] !== gen[e.b]){
        gen[e.b] = gen[e.a];
        moved = true;
      }
    });

    /* если кого-то сдвинули — его дети тоже спускаются */
    if (moved){
      parentEdges.forEach(e => {
        if (gen[e.a] == null) return;
        const want = gen[e.a] + 1;
        if (gen[e.b] == null || gen[e.b] < want){
          gen[e.b] = want;
          moved = true;
        }
      });
    }
  }

  const byGen = {};
  members.forEach(m => (byGen[gen[m.id]] = byGen[gen[m.id]] || []).push(m));

  const spouseOf = {};
  spouseEdges.forEach(e => { spouseOf[e.a] = e.b; spouseOf[e.b] = e.a; });

  Object.values(byGen).forEach(arr => {
    arr.sort((a,b) => a.name.localeCompare(b.name, 'ru'));
    const sorted = [], used = new Set();
    arr.forEach(m => {
      if (used.has(m.id)) return;
      sorted.push(m); used.add(m.id);
      const partner = arr.find(x => x.id === spouseOf[m.id]);
      if (partner && !used.has(partner.id)){ sorted.push(partner); used.add(partner.id); }
    });
    arr.length = 0; arr.push(...sorted);
  });

  const maxCols = Math.max(...Object.values(byGen).map(a => a.length), 1);
  const maxGen = Math.max(...Object.keys(byGen).map(Number), 0);
  const width  = Math.max(420, maxCols * TREE_COL_W + TREE_PAD * 2);
  const height = (maxGen + 1) * TREE_ROW_H + TREE_PAD * 2;

  const pos = {};
  Object.entries(byGen).forEach(([g, arr]) => {
    const gN = +g;
    const startX = (width - arr.length * TREE_COL_W) / 2 + TREE_COL_W / 2;
    arr.forEach((m, i) => {
      pos[m.id] = { x: startX + i * TREE_COL_W, y: TREE_PAD + gN * TREE_ROW_H + TREE_NODE_H };
    });
  });

  return { width, height, pos, parentEdges, spouseEdges, members, famColor, inlawIds };
}

/* возвращает { members, matched } — отфильтрованные по поиску + контекст */
function applyTreeFilter(members){
  const q = treeSearch.trim().toLowerCase();
  if (!q){
    return { members, matched: new Set(members.map(m => m.id)) };
  }

  const idsInScope = new Set(members.map(m => m.id));
  const matched = new Set();
  members.forEach(m => {
  const hay = (m.name || '').toLowerCase();
  if (hay.includes(q)) matched.add(m.id);
  });

    if (treeOnlyMatches) return { members: members.filter(m => matched.has(m.id)), matched };

  /* контекст: родители, супруги, братья найденных — приглушённо */
  const context = new Set();
  DB.relations.forEach(r => {
    if (!['родитель', 'супруг', 'брат'].includes(r.t)) return;
    if (!idsInScope.has(r.a) || !idsInScope.has(r.b)) return;
    if (matched.has(r.a) && !matched.has(r.b)) context.add(r.b);
    if (matched.has(r.b) && !matched.has(r.a)) context.add(r.a);
  });

  const shown = members.filter(m => matched.has(m.id) || context.has(m.id));
  return { members: shown, matched };
}

/* ============================================================
   Упорядочивание секций: связанные — рядом
   ============================================================ */
function orderClustersByConnection(clusters){
  if (clusters.length <= 1) return clusters;

  /* карта: id персонажа → индекс кластера */
  const clusterOf = {};
  clusters.forEach((c, i) => c.members.forEach(m => { clusterOf[m.id] = i; }));

  /* рёбра между кластерами */
  const adj = clusters.map(() => ({}));
  (DB.relations || []).forEach(r => {
    if (!['родитель', 'супруг', 'брат'].includes(r.t)) return;
    const ci = clusterOf[r.a], cj = clusterOf[r.b];
    if (ci == null || cj == null || ci === cj) return;
    adj[ci][cj] = (adj[ci][cj] || 0) + 1;
    adj[cj][ci] = (adj[cj][ci] || 0) + 1;
  });

  /* начинаем с самого большого кластера */
  let start = 0;
  for (let i = 1; i < clusters.length; i++){
    if (clusters[i].members.length > clusters[start].members.length) start = i;
  }

  const used = new Set();
  const order = [];
  let current = start;

  while (order.length < clusters.length){
    order.push(current);
    used.add(current);

    let next = -1, bestScore = -1;
    for (let i = 0; i < clusters.length; i++){
      if (used.has(i)) continue;
      let score = 0;
      for (const o of order) score += adj[i][o] || 0;
      if (score > bestScore ||
          (score === bestScore && next !== -1 &&
           clusters[i].members.length > clusters[next].members.length)){
        bestScore = score;
        next = i;
      }
    }
    if (next === -1) break;
    current = next;
  }

  /* остаток */
  for (let i = 0; i < clusters.length; i++){
    if (!used.has(i)) order.push(i);
  }

  return order.map(i => clusters[i]);
}

/* ============================================================
   Древо: единая отрисовка с глобальными поколениями
   ============================================================ */
function renderTree(){
  const viewport = document.getElementById('treeViewport');
  const inner = document.getElementById('treeInner');
  if (!viewport || !inner) return;
  inner.innerHTML = '';

  /* --- глобальные поколения --- */
  const gen = computeGlobalGenerations();
  const allGens = DB.characters.map(c => gen[c.id] ?? 0);
  const minGen = allGens.length ? Math.min(...allGens) : 0;
  const maxGen = allGens.length ? Math.max(...allGens) : 0;
  const rows = maxGen - minGen + 1;

  /* --- группировка по faction --- */
  const groups = {};
  DB.characters.forEach(c => {
    const key = c.faction || '_orphan';
    if (!groups[key]){
      const fam = (DB.families || []).find(f => f.id === key || f.name === key);
      groups[key] = {
        key,
        name: fam ? fam.name : (key === '_orphan' ? 'Вне кланов' : key),
        color: fam ? fam.color : '#8b98ab',
        members: []
      };
    }
    groups[key].members.push(c);
  });

  /* --- фильтр --- */
  const clusters = [];
  Object.values(groups).forEach(g => {
    let members = g.members;
    if (bloodOnly) members = members.filter(m => m.bornInto === g.key);
    const { members: shown, matched } = applyTreeFilter(members);
    if (!shown.length) return;
    clusters.push({ ...g, members: shown, matched });
  });

  if (!clusters.length){
    inner.innerHTML = `<p class="empty" style="padding:40px;text-align:center;font-style:italic">Ничего не найдено.</p>`;
    inner.style.width = '100%';
    inner.style.height = '200px';
    treeApplyTransform();
    return;
  }

  /* --- порядок секций: связанные рядом --- */
  const ordered = orderClustersByConnection(clusters);

  /* --- геометрия --- */
  const COL_W = 200, ROW_H = 230, NODE_H = 56, PAD = 70, GAP = 60, LABEL_TOP = 20;

  const spouseOf = {};
  DB.relations.filter(r => r.t === 'супруг').forEach(r => {
    spouseOf[r.a] = r.b; spouseOf[r.b] = r.a;
  });

  ordered.forEach(cluster => {
    const byGen = {};
    cluster.members.forEach(m => {
      const g = gen[m.id] ?? 0;
      (byGen[g] = byGen[g] || []).push(m);
    });
    Object.values(byGen).forEach(arr => {
      arr.sort((a,b) => a.name.localeCompare(b.name, 'ru'));
      const sorted = [], used = new Set();
      arr.forEach(m => {
        if (used.has(m.id)) return;
        sorted.push(m); used.add(m.id);
        const partner = arr.find(x => x.id === spouseOf[m.id]);
        if (partner && !used.has(partner.id)){ sorted.push(partner); used.add(partner.id); }
      });
      arr.length = 0; arr.push(...sorted);
    });
    const maxCols = Math.max(...Object.values(byGen).map(a => a.length), 1);
    cluster.byGen = byGen;
    cluster.width = Math.max(320, maxCols * COL_W + PAD * 2);
  });

  const totalW = ordered.reduce((s, c) => s + c.width, 0) + GAP * (ordered.length + 1);
  const totalH = rows * ROW_H + PAD + LABEL_TOP;

  inner.style.width = totalW + 'px';
  inner.style.height = totalH + 'px';

  /* --- позиционируем --- */
  const allPos = {};
  let xOff = GAP;

  ordered.forEach(cluster => {
    /* заголовок кластера */
    const labelEl = document.createElement('div');
    labelEl.className = 'tree-cluster-label';
    labelEl.style.left = (xOff + cluster.width / 2) + 'px';
    labelEl.style.top = LABEL_TOP + 'px';
    const textCol = textOnColor(cluster.color);
    labelEl.innerHTML = `<span class="fam-badge" style="--fc:${esc(cluster.color)};color:${textCol}">${esc(cluster.name)}</span>`;
    inner.appendChild(labelEl);

    /* узлы */
    Object.entries(cluster.byGen).forEach(([g, arr]) => {
      const gN = +g - minGen;
      const startX = xOff + (cluster.width - arr.length * COL_W) / 2 + COL_W / 2;
      arr.forEach((m, i) => {
        const x = startX + i * COL_W;
        const y = PAD + LABEL_TOP + gN * ROW_H + NODE_H;
        allPos[m.id] = { x, y };

        const isMatched = !cluster.matched || cluster.matched.has(m.id);
        const el = document.createElement('div');
        el.className = 'tree-node' + (!isMatched ? ' muted' : '');
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.innerHTML = avatarHTML(m, '', bloodColor(m)) + `<div class="tn-name">${esc(m.name)}</div>`;
        el.onclick = () => openChar(m.id);
        inner.appendChild(el);
      });
    });

    xOff += cluster.width + GAP;
  });

  /* --- SVG с рёбрами --- */
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'tree-svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.style.left = '0';
  svg.style.top = '0';
  svg.style.position = 'absolute';
  svg.style.pointerEvents = 'none';

  const AVATAR_R = 28, NAME_BLOCK = 46;
  const visibleIds = new Set(Object.keys(allPos));

    /* ============================================================
     Родительские рёбра: группируем детей по родительской паре,
     рисуем одну вертикаль + горизонталь + вертикали к детям
     ============================================================ */
  const parentEdges = DB.relations.filter(r => r.t === 'родитель');

  /* каждый ребёнок → список его видимых родителей */
  const childrenByParents = {};
  parentEdges.forEach(r => {
    if (!visibleIds.has(r.b)) return;
    const parents = parentEdges
      .filter(x => x.b === r.b && visibleIds.has(x.a))
      .map(x => x.a)
      .sort();
    if (!parents.length) return;
    const key = parents.join('|');
    if (!childrenByParents[key]) childrenByParents[key] = { parents, children: [] };
    if (!childrenByParents[key].children.includes(r.b)) {
      childrenByParents[key].children.push(r.b);
    }
  });

  /* helper для рисования линии */
  const makePath = (d, color) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', '1.6');
    p.setAttribute('fill', 'none');
    p.setAttribute('opacity', '0.55');
    p.setAttribute('stroke-linejoin', 'round');
    return p;
  };

  Object.values(childrenByParents).forEach(group => {
    const parentPositions = group.parents.map(p => allPos[p]).filter(Boolean);
    if (!parentPositions.length) return;

    /* X ствола: для пары — середина между родителями, для одного — его X */
    let trunkX;
    if (parentPositions.length === 1){
      trunkX = parentPositions[0].x;
    } else {
      const xs = parentPositions.map(p => p.x);
      trunkX = (Math.min(...xs) + Math.max(...xs)) / 2;
    }

    /* Y начала ствола: низ самого нижнего родителя */
    const parentBottomY = Math.max(
      ...parentPositions.map(p => p.y + AVATAR_R + NAME_BLOCK)
    );

    /* Y детей (верх аватара) */
    const childTops = group.children
      .map(c => allPos[c] ? allPos[c].y - AVATAR_R : null)
      .filter(v => v != null);
    if (!childTops.length) return;

    /* Y горизонтали — середина между родителем и детьми */
    const railY = (parentBottomY + Math.min(...childTops)) / 2;

    /* цвет линии — по bloodColor первого ребёнка */
    const lineColor = bloodColor(byId(group.children[0])) || '#8fa3b8';

    /* вертикаль от родителя (пары) до горизонтали */
    svg.appendChild(makePath(`M ${trunkX} ${parentBottomY} L ${trunkX} ${railY}`, lineColor));

    /* горизонталь через всех детей */
    const childXs = group.children.map(c => allPos[c].x);
    const minX = Math.min(trunkX, ...childXs);
    const maxX = Math.max(trunkX, ...childXs);
    svg.appendChild(makePath(`M ${minX} ${railY} L ${maxX} ${railY}`, lineColor));

    /* вертикали от горизонтали к каждому ребёнку */
    group.children.forEach(c => {
      const cx = allPos[c].x;
      const cy = allPos[c].y - AVATAR_R;
      svg.appendChild(makePath(`M ${cx} ${railY} L ${cx} ${cy}`, lineColor));
    });
  });

  const seenSpouse = new Set();
  DB.relations.filter(r => r.t === 'супруг').forEach(r => {
    const k = [r.a, r.b].sort().join('|');
    if (seenSpouse.has(k)) return;
    seenSpouse.add(k);
    if (!visibleIds.has(r.a) || !visibleIds.has(r.b)) return;
    const a = allPos[r.a], b = allPos[r.b];
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('stroke', REL_COLORS['супруг'] || '#e0709a');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(line);
  });

  inner.appendChild(svg);

  /* --- применяем текущий zoom/pan --- */
  treeApplyTransform();

  /* авто-фит только при первом рендере после загрузки страницы */
  if (!window.__treeFittedOnce){
    window.__treeFittedOnce = true;
    setTimeout(() => treeFit(), 30);
  } else {
    /* при перерисовке (поиск, кровные) просто применяем текущий zoom/pan */
    treeApplyTransform();
  }
}

/* ============================================================
   Управление зумом и панорамированием древа
   ============================================================ */
let treeScale = 1, treeTx = 0, treeTy = 0;

function treeApplyTransform(){
  const inner = document.getElementById('treeInner');
  if (!inner) return;
  inner.style.transform = `translate(${treeTx}px, ${treeTy}px) scale(${treeScale})`;
  const lvl = document.getElementById('treeZoomLevel');
  if (lvl) lvl.textContent = Math.round(treeScale * 100) + '%';
}

function treeFit(force){
  const vp = document.getElementById('treeViewport');
  const inner = document.getElementById('treeInner');
  if (!vp || !inner) return;
  const vpW = vp.clientWidth, vpH = vp.clientHeight;
  const iw = parseFloat(inner.style.width) || 1000;
  const ih = parseFloat(inner.style.height) || 600;
  const pad = 40;
  const sc = Math.min((vpW - pad) / iw, (vpH - pad) / ih, 1);

  const MIN_READABLE = 0.6;

  /* если вписать целиком нельзя без потери читаемости — открываем по центру в 100% */
  if (!force && sc < MIN_READABLE){
    treeScale = 1;
    /* если древо шире окна — прижимаем влево, если уже — центрируем */
    treeTx = iw <= vpW ? (vpW - iw) / 2 : 20;
    /* то же по вертикали */
    treeTy = ih <= vpH ? (vpH - ih) / 2 : 20;
    treeApplyTransform();
    return;
  }

  treeScale = Math.max(0.15, sc);
  treeTx = (vpW - iw * treeScale) / 2;
  treeTy = (vpH - ih * treeScale) / 2;
  treeApplyTransform();
}

function treeZoom(factor){
  const vp = document.getElementById('treeViewport');
  if (!vp) return;
  const cx = vp.clientWidth / 2;
  const cy = vp.clientHeight / 2;
  const newScale = Math.max(0.15, Math.min(3, treeScale * factor));
  treeTx = cx - (cx - treeTx) * (newScale / treeScale);
  treeTy = cy - (cy - treeTy) * (newScale / treeScale);
  treeScale = newScale;
  treeApplyTransform();
}

/* контролы */
document.getElementById('treeZoomIn').onclick  = () => treeZoom(1.25);
document.getElementById('treeZoomOut').onclick = () => treeZoom(0.8);
document.getElementById('treeFit').onclick     = () => treeFit(true);

/* зум колесом */
document.getElementById('treeViewport').addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaY) < 30) return;
  e.preventDefault();
  const vp = e.currentTarget;
  const r = vp.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const cy = e.clientY - r.top;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const newScale = Math.max(0.15, Math.min(3, treeScale * factor));
  treeTx = cx - (cx - treeTx) * (newScale / treeScale);
  treeTy = cy - (cy - treeTy) * (newScale / treeScale);
  treeScale = newScale;
  treeApplyTransform();
}, { passive: false });

/* панорамирование мышью */
(function(){
  const vp = document.getElementById('treeViewport');
  let dragging = false, lastX = 0, lastY = 0;

  vp.addEventListener('pointerdown', e => {
    /* не начинаем pan, если клик по узлу */
    if (e.target.closest('.tree-node')) return;
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    vp.classList.add('dragging');
    vp.setPointerCapture(e.pointerId);
  });

  vp.addEventListener('pointermove', e => {
    if (!dragging) return;
    treeTx += e.clientX - lastX;
    treeTy += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    treeApplyTransform();
  });

  vp.addEventListener('pointerup', e => {
    dragging = false;
    vp.classList.remove('dragging');
    try { vp.releasePointerCapture(e.pointerId); } catch(_){}
  });
  vp.addEventListener('pointercancel', () => {
    dragging = false;
    vp.classList.remove('dragging');
  });
})();

  };
  r.readAsText(f);
  ev.target.value = '';
};

$('#btnAddChar').onclick = () => openCharForm(null);
$('#btnAddLocation').onclick = () => openLocationForm(null);
$('#btnAddEvent').onclick = () => openEventForm(null);

/* ============================================================
   Обработчик «Очистить» — убирает панель напрямую
   ============================================================ */
document.addEventListener('click', e => {
  if (e.target.id !== 'llCompareClear') return;
  e.preventDefault();
  compareIds.clear();

  /* жёстко прячем панель, не надеясь на перерисовку */
  const box = document.getElementById('llCompare');
  if (box){ box.hidden = true; box.innerHTML = ''; }

  /* перерисовываем список, чтобы снять галочки и подсветку строк */
  renderLifelines();
});

/* ============================================================
   Старт
   ============================================================ */
boot();
</script>
</body>
</html>
