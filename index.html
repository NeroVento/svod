<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картотека</title>
<style>
  :root{
    --bg:#0b0f15; --bg2:#111823; --card:#161f2c; --card2:#1c2735;
    --line:#26313f; --text:#dde5ef; --dim:#8593a6; --accent:#e0a458;
    --danger:#e2574c; --ok:#5fc9a8;
    --shadow:0 18px 40px -18px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1200px 700px at 15% -10%, #1a2433 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #1d1a2a 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.2px}

  /* шапка */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;
    padding:14px 28px;
    background:rgba(11,15,21,.82); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; gap:14px; align-items:center}
  .logo{
    width:42px;height:42px;flex:none;display:grid;place-items:center;font-size:20px;
    border-radius:12px; color:#0b0f15;
    background:linear-gradient(145deg,#f0c07a,#c07f36);
    box-shadow:0 0 24px -6px rgba(224,164,88,.65);
  }
  .brand h1{margin:0;font-size:19px}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--dim);letter-spacing:.4px}

  nav.tabs{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:12px;border:1px solid var(--line)}
  nav.tabs button{
    border:0;background:transparent;color:var(--dim);font:inherit;font-size:13.5px;
    padding:8px 18px;border-radius:9px;cursor:pointer;transition:.18s;
  }
  nav.tabs button:hover{color:var(--text)}
  nav.tabs button.active{background:var(--card2);color:var(--text);box-shadow:0 2px 12px -6px #000}

  /* статусбар */
  .statusbar{
    position:sticky; top:71px; z-index:40;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:8px 28px; font-size:12.5px;
    background:rgba(17,24,35,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .statusbar .src{color:var(--dim)}
  .statusbar .src b{color:var(--text);font-weight:500}
  .statusbar .src.draft b{color:var(--accent)}
  .statusbar .src.fail b{color:var(--danger)}
  .statusbar .spacer{flex:1}
  .statusbar button{
    border:1px solid var(--line); background:var(--bg2); color:var(--dim);
    padding:6px 12px; border-radius:9px; cursor:pointer; font:inherit; font-size:12.5px;
    transition:.15s; white-space:nowrap;
  }
  .statusbar button:hover{color:var(--text); border-color:#3b4a5e}
  .statusbar button.on{color:#0b0f15; background:var(--accent); border-color:var(--accent); font-weight:600}
  .statusbar button.danger:hover{color:var(--danger); border-color:var(--danger)}
  .statusbar button[hidden]{display:none}

  .banner{
    padding:11px 28px; font-size:13px;
    background:rgba(224,164,88,.09); color:#e5c79a;
    border-bottom:1px solid rgba(224,164,88,.25);
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .banner.wide{
  flex-direction:column; align-items:stretch; gap:0;
  padding:18px 28px;
}
.banner.wide code{
  background:rgba(255,255,255,.06); padding:1px 6px;
  border-radius:4px; font-size:12px;
}
  .banner[hidden]{display:none}
  .banner button{
    background:transparent; border:1px solid #6b5433; color:#e5c79a;
    padding:4px 11px; border-radius:7px; cursor:pointer; font:inherit; font-size:12px;
  }
  .banner button:hover{background:rgba(224,164,88,.15)}

  main{padding:24px 28px 60px;max-width:1320px;margin:0 auto}
  .tab{display:none} .tab.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* тулбар */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
  #search{
    flex:1;min-width:220px;padding:11px 16px;border-radius:11px;
    background:var(--bg2);border:1px solid var(--line);color:var(--text);font:inherit;outline:none;
    transition:.18s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,164,88,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);color:var(--dim);transition:.18s;user-select:none;
  }
  .chip:hover{color:var(--text);border-color:#3a4859}
  .chip.on{color:#0b0f15;background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-add{
    padding:9px 16px;border-radius:11px;font-size:13.5px;cursor:pointer;font:inherit;
    background:var(--bg2); border:1px dashed #3b4a5e; color:var(--dim); transition:.15s;
  }
  .btn-add:hover{color:var(--accent); border-color:var(--accent); border-style:solid}
  .btn-toggle{
    padding:8px 16px; border-radius:10px; font:inherit; font-size:13px;
    cursor:pointer; background:var(--bg2); border:1px solid var(--line);
    color:var(--dim); transition:.15s;
  }
  .btn-toggle:hover{ color:var(--text); border-color:#3a4859; }
  .btn-toggle.on{ color:#0b0f15; background:var(--accent); border-color:var(--accent); font-weight:600; }

  /* сетка карточек */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{
    position:relative;background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;
    transition:.22s; overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;inset:0 0 auto 0;height:3px;
    background:var(--c);opacity:.75;
  }
  .card:hover{transform:translateY(-4px);border-color:#3b4a5e;box-shadow:var(--shadow)}
  .card:hover::before{opacity:1}
  .card-actions{
    position:absolute; top:12px; right:12px; display:flex; gap:5px;
    opacity:0; transition:.15s; z-index:2;
  }
  .card:hover .card-actions,
  .loc-card:hover .card-actions{ opacity:1; }
  .card-actions button{
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:rgba(11,15,21,.85); border:1px solid var(--line); color:var(--dim);
    cursor:pointer; font-size:13px; padding:0;
  }
  .card-actions button:hover{color:var(--text); border-color:#3b4a5e}
  .card-actions button.del:hover{color:var(--danger); border-color:var(--danger)}
  .card-top{display:flex;gap:13px;align-items:center;margin-bottom:13px}
  .avatar{
    position:relative; overflow:hidden;
    width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;
    font-weight:700;font-size:17px;letter-spacing:.5px;color:#0b0f15;
    background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%, #0b0f15));
    box-shadow:0 0 22px -8px var(--c);
  }
  .avatar.has-photo{ background:#0b0f15; }
  .avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .card h3{margin:0;font-size:16.5px}
  .alias{font-size:12px;color:var(--dim);font-style:italic}
  .tagline{font-size:13px;color:#a9b6c7;margin:0 0 13px;min-height:38px}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:11px; padding:3px 9px; border-radius:6px; letter-spacing:.3px;
  background:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 60%, #000);
  font-weight:600;
  /* цвет текста задаётся из JS */
}
  .badge.ghost{background:transparent;color:var(--dim);border-color:var(--line)}

  /* флаги стран */
  /* флаги стран */
.flags{
  display:inline-flex; gap:3px; align-items:center; vertical-align:middle;
  line-height:1;
}
.flags .fl{ display:inline-flex; align-items:center; filter:grayscale(.4) opacity(.7); }
.flags .fl.last{ filter:none; }
.flags .fl + .fl::before{
  content:'→'; font-size:9px; color:var(--dim); margin:0 4px;
}
.flags .fl img{
  width:20px; height:auto; border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08);
  display:block;
}
.chip-flag{
  width:16px; height:auto; border-radius:2px;
  vertical-align:middle; margin-right:5px;
}

  /* таймлайн */
  .timeline{position:relative;padding-left:34px;max-width:860px}
  .timeline::before{
    content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;
    background:linear-gradient(180deg,transparent,#2f3d4f 8%,#2f3d4f 92%,transparent);
  }
  .ev{position:relative;margin-bottom:16px;padding:15px 18px;border-radius:14px;
      background:var(--card);border:1px solid var(--line);transition:.2s}
  .ev:hover{border-color:#3b4a5e;background:var(--card2)}
  .ev::before{
    content:'';position:absolute;left:-31px;top:20px;width:11px;height:11px;border-radius:50%;
    background:var(--bg);border:2px solid var(--accent);
    box-shadow:0 0 12px -2px var(--accent);
  }
  .ev-actions{position:absolute;top:12px;right:12px;display:flex;gap:5px;opacity:0;transition:.15s}
  .ev:hover .ev-actions{opacity:1}
  .ev-actions button{
    width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    background:rgba(11,15,21,.85); border:1px solid var(--line); color:var(--dim);
    cursor:pointer; font-size:12px; padding:0;
  }
  .ev-actions button:hover{color:var(--text); border-color:#3b4a5e}
  .ev-actions button.del:hover{color:var(--danger); border-color:var(--danger)}
  .ev-year{font-size:12px;letter-spacing:1.4px;color:var(--accent);font-weight:700}
  .ev h3{margin:3px 0 7px;font-size:16.5px}
  .ev p{margin:0 0 11px;font-size:13.5px;color:#a9b6c7}
  .cast{display:flex;flex-wrap:wrap;gap:6px}
  .cast span{
    font-size:11.5px;padding:3px 10px;border-radius:20px;cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);color:var(--dim);transition:.15s;
  }
  .cast span:hover{color:var(--text);border-color:var(--accent)}

  /* ползунок года */
  .ll-yearbar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:14px 18px; margin-bottom:14px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  .ll-yearbar label{
    font-size:11.5px; letter-spacing:1px; color:var(--dim);
    text-transform:uppercase; font-weight:600;
  }
  .ll-yearbar .year-val{
    font-family:Georgia,serif; font-size:26px; color:var(--accent);
    font-weight:600; min-width:76px; text-align:center; cursor:pointer;
    border-bottom:1px dashed transparent; transition:.15s;
  }
  .ll-yearbar .year-val:hover{ border-bottom-color:var(--accent); }
  .ll-yearbar .year-input{
    width:86px; padding:6px 10px; font:inherit; font-size:16px;
    background:var(--bg2); border:1px solid var(--line); color:var(--accent);
    border-radius:9px; text-align:center; font-family:Georgia,serif; font-weight:600;
  }
  .ll-yearbar input[type=range]{
    flex:1; min-width:180px; accent-color:var(--accent); cursor:pointer;
  }
  .ll-yearbar .jump{ display:flex; gap:4px; flex-wrap:wrap; }
  .ll-yearbar .jump button{
    padding:4px 10px; font:inherit; font-size:11.5px;
    background:var(--bg2); border:1px solid var(--line); color:var(--dim);
    border-radius:7px; cursor:pointer; transition:.15s;
  }
  .ll-yearbar .jump button:hover{ color:var(--text); border-color:#3a4859; }
  .ll-yearbar .jump button.on{ color:#0b0f15; background:var(--accent); border-color:var(--accent); font-weight:600; }

  /* линии жизни */
  .ll-filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .ll-filters input{
    flex:1; min-width:180px; max-width:320px; padding:8px 14px;
    background:var(--bg2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; font:inherit; font-size:13.5px; outline:none;
  }
  .ll-filters input:focus{ border-color:var(--accent); }

  #lifelines{
    position:relative; overflow:auto; max-height:calc(100vh - 340px);
    background:var(--bg2); border:1px solid var(--line); border-radius:14px;
  }
  .ll-header{
    position:sticky; top:0; z-index:3; display:flex;
    background:var(--card); border-bottom:1px solid var(--line);
    font-size:11px; color:var(--dim); letter-spacing:.5px;
  }
  .ll-header .ll-label-col{
  position:sticky; left:0; z-index:4; background:var(--card);
  flex:none; width:var(--ll-label-w, 290px); padding:8px 12px;
  border-right:1px solid var(--line);
  font-weight:600;
}
  .ll-header .ll-scale{
    position:relative; flex:none; height:28px;
  }
  .ll-header .tick{
    position:absolute; top:0; bottom:0;
    border-left:1px solid rgba(255,255,255,.06);
    padding-left:5px; padding-top:7px; font-size:10.5px; white-space:nowrap;
  }
  .ll-header .tick.now{ color:var(--accent); font-weight:700; }
  .ll-resizer{
  position:absolute; top:0; bottom:0; right:-3px;
  width:6px; cursor:col-resize;
  z-index:10;
  transition:background .15s;
}
.ll-resizer:hover,
.ll-resizer.dragging{
  background:linear-gradient(180deg, transparent, var(--accent) 30%, var(--accent) 70%, transparent);
  opacity:.5;
}
  .ll-row{
    display:flex; border-bottom:1px solid rgba(255,255,255,.03);
    min-height:32px;
  }
  .ll-row:hover{ background:rgba(255,255,255,.02); }
  .ll-row .ll-label-col{
    position:sticky; left:0; z-index:2; flex:none; width:var(--ll-label-w, 290px);
    padding:6px 12px; background:var(--bg2); border-right:1px solid var(--line);
    display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  .ll-row:hover .ll-label-col{ background:var(--card2); }
  .ll-row .ll-avatar{
    width:22px; height:22px; flex:none; border-radius:6px; font-size:9.5px;
    font-weight:700; color:#0b0f15; display:grid; place-items:center;
    background:linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 55%, #0b0f15));
    overflow:hidden; position:relative;
  }
  .ll-row .ll-avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ll-row .ll-name{
  font-size:13px; color:var(--text); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  flex:1; min-width:0;
  font-weight:500;
}
  .ll-row .ll-flags{ font-size:13px; flex:none; }
  .ll-row .ll-age{
    flex:none; font-size:11.5px; padding:2px 8px; border-radius:20px;
    background:var(--bg2); border:1px solid var(--line); color:var(--text);
    font-variant-numeric:tabular-nums; min-width:44px; text-align:center;
  }
  .ll-row .ll-age.unborn{ color:var(--dim); font-style:italic; }
  .ll-row .ll-age.dead{ color:#a98484; background:rgba(226,87,76,.08); border-color:rgba(226,87,76,.25); }
  .ll-row .ll-track{ position:relative; flex:none; height:32px; }
  .ll-row.unborn .ll-track{ opacity:.2; }
  .ll-row.unborn .ll-avatar{ filter:grayscale(1) opacity(.35); }
  .ll-row .ll-bar{
    position:absolute; top:50%; transform:translateY(-50%);
    height:3px; border-radius:2px; opacity:.55;
  }
  .ll-row .ll-bar.dead-seg{
    background:repeating-linear-gradient(
      45deg, rgba(226,87,76,.35), rgba(226,87,76,.35) 3px,
      transparent 3px, transparent 6px);
    opacity:1;
  }
  .ll-row .ll-dot{
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:9px; height:9px; border-radius:50%;
    border:2px solid var(--bg2); cursor:help;
    transition:.15s;
  }
  .ll-row .ll-dot:hover{ transform:translate(-50%,-50%) scale(1.6); }
  .ll-now{
    position:absolute; top:0; bottom:0; width:2px;
    background:linear-gradient(180deg, rgba(224,164,88,.85), rgba(224,164,88,.15));
    pointer-events:none; z-index:1;
  }
  .ll-now::after{
    content:''; position:absolute; top:-1px; left:-3px;
    width:8px; height:8px; border-radius:50%; background:var(--accent);
  }
  .ll-empty{
    padding:40px 20px; text-align:center; color:var(--dim); font-style:italic;
  }
  .ll-tip{
    position:fixed; z-index:200; pointer-events:none;
    background:#0b0f15; border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; font-size:12px; color:var(--text);
    box-shadow:var(--shadow); max-width:260px; display:none;
  }
  .ll-tip.on{ display:block; }
  .ll-tip b{ color:var(--accent); }

  /* древо */
  .tree-section{ margin-bottom:32px; }
 .tree-section h3{ margin:0 0 12px; font-size:19px; letter-spacing:.3px;
                  display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.fam-badge{
  font-size:15px; padding:6px 16px; border-radius:22px; letter-spacing:.4px;
  font-weight:600;
  background:var(--fc);
  border:1px solid color-mix(in srgb,var(--fc) 60%, #000);
  /* цвет текста задаётся из JS */
}
  .fam-plus{ color:var(--dim); font-size:13px; font-weight:400; }
  .tree-section h3.neutral{ color:#8b98ab; font-size:13px; }
  .tree-canvas{
    position:relative; overflow-x:auto;
    background:var(--bg2); border:1px solid var(--line); border-radius:16px;
  }
  .tree-svg{ position:absolute; inset:0; pointer-events:none; }
.tree-node{
  position:absolute; transform:translate(-50%,-50%);
  display:block; cursor:pointer; width:56px; height:56px; z-index:1;
}
.tree-node .avatar{
  width:56px; height:56px; border-radius:16px; font-size:17px;
}
.tree-node:hover .avatar{ box-shadow:0 0 22px -4px var(--c); }
.tn-name{
  position:absolute; top:100%; left:50%; transform:translateX(-50%);
  margin-top:13px; width:auto; max-width:220px; pointer-events:none;
  font-size:16px; font-weight:700; color:#f0f5fb;
  text-align:center; line-height:1.3;
  white-space:nowrap;
  text-shadow:0 2px 6px rgba(0,0,0,.7);
}
  .tn-dead .avatar{ filter:grayscale(.75); opacity:.7; }
  .tn-dead .tn-name{ opacity:.65; font-style:italic; }
  .tree-node.tn-inlaw .avatar{
    border:1.5px dashed color-mix(in srgb, var(--c) 70%, transparent);
    box-shadow:none; opacity:.85;
  }
  .tree-node.tn-inlaw .tn-name{ opacity:.72; font-style:italic; }

  /* модалки */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;
         padding:40px 20px;overflow-y:auto;background:rgba(5,8,12,.72);backdrop-filter:blur(6px)}
  .modal.on{display:flex;animation:fade .2s ease}
  .sheet{
    width:100%;max-width:660px;background:linear-gradient(165deg,var(--card),#131b26);
    border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);
    position:relative;animation:pop .26s cubic-bezier(.2,.9,.3,1.2);
  }
  .sheet.wide{max-width:760px}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
  .close{
    position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-size:17px;line-height:1;
  }
  .close:hover{color:var(--text);border-color:#3b4a5e}
  .sheet-head{display:flex;gap:16px;align-items:center;margin-bottom:20px}
  .sheet-head .avatar{width:66px;height:66px;border-radius:18px;font-size:21px}
  .sheet-head h2{margin:0;font-size:23px}
  .sheet-head .alias{font-size:13px}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
  .meta div{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
  .meta b{display:block;font-size:10.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;font-weight:600}
  .meta span{font-size:13.5px}
  .quote{
    border-left:3px solid var(--c);padding:6px 0 6px 16px;margin:0 0 20px;
    font-family:Georgia,serif;font-style:italic;font-size:15px;color:#c3cfdd;
  }
  .sheet h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin:22px 0 11px}
  .sheet p.bio{font-size:14px;color:#b6c2d1;margin:0}
  .traits{display:grid;gap:9px}
  .trait{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:12.5px;color:var(--dim)}
  .bar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff))}
  .trait b{color:var(--text);font-size:12.5px;text-align:right}
  .rel{display:flex;flex-direction:column;gap:7px}
  .rel .row{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 13px;
    color:var(--text);font:inherit;font-size:13px;transition:.15s;
  }
  .rel .row.clickable{cursor:pointer}
  .rel .row.clickable:hover{border-color:#3b4a5e;transform:translateX(3px)}
  .rel .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .rel .rt{font-size:11px;letter-spacing:.5px;margin-left:auto;opacity:.9}
  .empty{color:var(--dim);font-size:13.5px;font-style:italic}

  /* формы */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
  .fgrid label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;font-weight:600}
  .fgrid label.full{grid-column:1/-1}
  .fgrid input,.fgrid textarea,.fgrid select{
    background:var(--bg2); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; border-radius:10px; font:inherit; font-size:14px; outline:none;
    transition:.15s; width:100%;
  }
  .fgrid input:focus,.fgrid textarea:focus,.fgrid select:focus{border-color:var(--accent)}
  .fgrid textarea{resize:vertical; min-height:70px; line-height:1.5; font-size:13.5px}
  .fgrid .hint{font-size:11px; color:var(--dim); text-transform:none; letter-spacing:0; font-weight:400; font-style:italic}
  .form-actions{
    display:flex; gap:10px; justify-content:flex-end; margin-top:22px;
    padding-top:18px; border-top:1px solid var(--line);
  }
  .form-actions button{
    padding:10px 20px; border-radius:11px; font:inherit; font-size:14px; cursor:pointer;
    border:1px solid var(--line); background:var(--bg2); color:var(--text); transition:.15s;
  }
  .form-actions button:hover{border-color:#3b4a5e}
  .form-actions button.primary{
    background:var(--accent); border-color:var(--accent); color:#0b0f15; font-weight:600;
  }
  .form-actions button.primary:hover{background:#eab673}
  .form-actions button.del{margin-right:auto; color:var(--danger); border-color:#4a2825}
  .form-actions button.del:hover{background:rgba(226,87,76,.1)}

  .checks{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:6px;
    max-height:180px; overflow-y:auto; padding:8px;
    background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  }
  .checks label{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text);
    padding:5px 8px; border-radius:7px; cursor:pointer; text-transform:none; letter-spacing:0;
  }
  .checks label:hover{background:var(--card2)}
  .checks input{width:auto; accent-color:var(--accent)}

  /* фото в форме */
  .photo-row{ display:flex; gap:12px; align-items:center; }
  .photo-prev{
    width:64px; height:64px; flex:none; border-radius:14px; overflow:hidden;
    background:var(--bg2); border:1px solid var(--line);
    display:grid; place-items:center; font-size:11px; color:var(--dim); text-align:center;
  }
  .photo-prev img{ width:100%; height:100%; object-fit:cover; }
  .photo-row .photo-fields{ flex:1; display:flex; flex-direction:column; gap:6px; }

/* сравнение */
/* сравнение */
.ll-pin{
  width:16px; height:16px; flex:none; cursor:pointer;
  accent-color:var(--accent); margin-right:6px;
}
.ll-row.picked{ background:rgba(224,164,88,.05); }
.ll-row.picked .ll-label-col{ background:rgba(224,164,88,.08); }

.ll-compare{
  margin-bottom:14px; padding:16px 20px;
  background:linear-gradient(160deg, var(--card), var(--card2));
  border:1px solid var(--line); border-radius:14px;
}
.ll-compare-head{
  display:flex; align-items:baseline; gap:10px; margin-bottom:14px;
}
.ll-compare-head b{ font-size:14px; }
.ll-compare-hint{ font-size:12px; color:var(--dim); }
.ll-compare-head button{
  margin-left:auto; padding:5px 12px; font:inherit; font-size:12px;
  background:var(--bg2); border:1px solid var(--line); color:var(--dim);
  border-radius:8px; cursor:pointer; transition:.15s;
}
.ll-compare-head button:hover{ color:var(--danger); border-color:var(--danger); }

.ll-compare-list{ display:flex; flex-direction:column; gap:8px; }
.ll-compare-row{
  display:grid; grid-template-columns:160px 1fr 48px 52px;
  gap:12px; align-items:center; font-size:13px;
}
.ll-compare-name{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ll-compare-bar{
  height:8px; background:var(--bg2); border-radius:4px; overflow:hidden;
}
.ll-compare-bar i{
  display:block; height:100%; border-radius:4px;
  transition:width .35s cubic-bezier(.2,.9,.3,1);
}
.ll-compare-age{
  font-variant-numeric:tabular-nums; text-align:right;
  font-weight:600; color:var(--accent);
}
.ll-compare-born{
  font-size:11.5px; color:var(--dim); text-align:right;
  font-variant-numeric:tabular-nums;
}

.ll-compare-pairs{
  margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:8px;
}
.ll-compare-pair{
  display:grid; grid-template-columns:44px auto 1fr;
  gap:14px; align-items:center; font-size:13px;
  padding:5px 0;
}
.ll-compare-pair-num{
  font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
}
.ll-compare-pair-chain{
  display:flex; align-items:center; gap:8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ll-compare-pair-chain .pc-arrow{
  color:var(--dim); font-size:14px;
}
.ll-compare-pair-diff{
  text-align:left; color:#a9b6c7; white-space:nowrap;
  padding-left:18px; margin-left:4px;
  border-left:1px solid var(--line);
}
.ll-compare-pair-diff b{ color:var(--accent); font-weight:700; }

/* режимы древа */
.tree-cluster-label{
  position:absolute; transform:translateX(-50%);
  z-index:2; white-space:nowrap;
}
.tree-inner{
  position:relative;
  margin:0 auto;
}
.tree-canvas{
  /* переопределяем — теперь центрируем внутренний блок */
  text-align:center;
}
.tree-canvas .tree-inner{
  display:block;
  text-align:left;
}

/* локации */
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.loc-card{
  position:relative;
  background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  cursor:pointer; transition:.22s;
}
.loc-card:hover{transform:translateY(-4px);border-color:#3b4a5e;box-shadow:var(--shadow)}
.loc-photo{
  height:150px; background:#0b0f15;
  position:relative; overflow:hidden;
  display:grid; place-items:center;
  color:var(--dim); font-size:12px;
  letter-spacing:2px; text-transform:uppercase;
}
.loc-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.loc-photo .loc-flag{
  position:absolute; top:10px; right:10px;
  width:28px; height:auto; border-radius:3px;
  box-shadow:0 2px 10px rgba(0,0,0,.6);
}
.loc-photo .loc-type-badge{
  position:absolute; bottom:10px; left:10px;
  padding:4px 10px; border-radius:20px;
  background:rgba(11,15,21,.82); backdrop-filter:blur(8px);
  font-size:11px; color:var(--text); letter-spacing:.5px;
  border:1px solid var(--line);
}
.loc-body{ padding:16px; }
.loc-body h3{ margin:0 0 6px; font-size:16.5px; }
.loc-tagline{
  font-size:13px; color:#a9b6c7; margin:8px 0 12px; min-height:38px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.loc-meta{ display:flex; flex-wrap:wrap; gap:6px; }
.loc-meta .count{
  font-size:11px; padding:3px 9px; border-radius:6px;
  background:var(--bg2); border:1px solid var(--line); color:var(--dim);
}

/* карточка локации в модалке */
.loc-sheet-head{ display:flex; gap:16px; align-items:flex-start; margin-bottom:20px; }
.loc-sheet-photo{
  width:110px; height:110px; flex:none; border-radius:16px; overflow:hidden;
  background:#0b0f15; display:grid; place-items:center;
  font-size:11px; color:var(--dim); letter-spacing:1.5px; text-transform:uppercase;
}
.loc-sheet-photo img{ width:100%; height:100%; object-fit:cover; }
.loc-sheet-head-info{ flex:1; min-width:0; }
.loc-sheet-head-info h2{ margin:0 0 4px; font-size:22px; }
.loc-breadcrumb{
  font-size:12px; color:var(--dim); margin-bottom:8px;
  display:flex; flex-wrap:wrap; gap:4px; align-items:center;
}
.loc-breadcrumb .crumb{ cursor:pointer; }
.loc-breadcrumb .crumb:hover{ color:var(--accent); }
.loc-breadcrumb .sep{ opacity:.4; }
.loc-badges{ display:flex; flex-wrap:wrap; gap:6px; }

/* чипы жителей */
.residents{ display:flex; flex-wrap:wrap; gap:6px; }
.residents button{
  display:flex; align-items:center; gap:8px;
  padding:6px 12px 6px 6px; border-radius:20px;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--text); font:inherit; font-size:12.5px;
  cursor:pointer; transition:.15s;
}
.residents button:hover{ border-color:var(--accent); }
.residents .mini-avatar{
  width:24px; height:24px; border-radius:8px; flex:none;
  display:grid; place-items:center; font-size:10px; font-weight:700;
  color:#0b0f15; overflow:hidden;
  background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#0b0f15));
}
.residents .mini-avatar img{ width:100%; height:100%; object-fit:cover; }

/* поиск в древе */
#treeSearch{
  flex:0 1 260px; min-width:180px;
  padding:8px 14px; border-radius:10px;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--text); font:inherit; font-size:13.5px; outline:none;
  transition:.15s;
}
#treeSearch:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(224,164,88,.12); }
.tree-search-count{ font-size:12.5px; color:var(--dim); white-space:nowrap; }

/* приглушённый контекст вокруг найденных */
.tree-node.muted{ opacity:.55; transition:opacity .2s; }
.tree-node.muted .avatar{ filter:grayscale(.35); }
.tree-node.muted:hover{ opacity:1; }
.tree-node.muted:hover .avatar{ filter:none; }
.tree-node.muted .tn-name{ color:#8b98ab; }

.tree-only{
  display:inline-flex; align-items:center; gap:7px;
  font-size:12.5px; color:var(--dim); cursor:pointer;
  padding:6px 12px; border-radius:10px;
  background:var(--bg2); border:1px solid var(--line);
  transition:.15s; user-select:none; white-space:nowrap;
}
.tree-only:hover{ color:var(--text); border-color:#3a4859; }
.tree-only input{ accent-color:var(--accent); cursor:pointer; }

/* связи в форме персонажа */
.rel-edit-list{ display:flex; flex-direction:column; gap:8px; }
.rel-edit-row{
  display:grid; grid-template-columns:150px 1fr 1fr 36px;
  gap:8px; align-items:center;
}
.rel-edit-row select,
.rel-edit-row input{
  width:100%; padding:8px 11px;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--text); border-radius:9px;
  font:inherit; font-size:13.5px; outline:none;
  transition:.15s;
}
.rel-edit-row select:focus,
.rel-edit-row input:focus{ border-color:var(--accent); }
.rel-edit-del{
  width:32px; height:32px; border-radius:9px;
  display:grid; place-items:center;
  background:transparent; border:1px solid var(--line);
  color:var(--dim); cursor:pointer; font-size:14px; padding:0;
  transition:.15s;
}
.rel-edit-del:hover{ color:var(--danger); border-color:var(--danger); }
.rel-add-btn{
  margin-top:8px; padding:7px 14px; font:inherit; font-size:13px;
  background:var(--bg2); border:1px dashed #3b4a5e; color:var(--dim);
  border-radius:9px; cursor:pointer; transition:.15s;
}
.rel-add-btn:hover{ color:var(--accent); border-color:var(--accent); border-style:solid; }

.year-chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 11px;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; font-size:12.5px;
  color:var(--dim); cursor:pointer;
  transition:.15s;
}
.year-chip:hover{ border-color:var(--accent); color:var(--text); }
.year-chip b{
  color:var(--accent); font-weight:600;
  font-variant-numeric:tabular-nums;
}
.year-chip input{
  width:64px; padding:2px 6px;
  font:inherit; font-size:12.5px;
  background:var(--bg); border:1px solid var(--accent);
  color:var(--accent); border-radius:6px;
  text-align:center; font-weight:600;
  outline:none; font-variant-numeric:tabular-nums;
}
.year-reset{
  padding:4px 8px;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; font:inherit; font-size:12px;
  color:var(--dim); cursor:pointer;
  transition:.15s;
}
.year-reset:hover{ border-color:var(--accent); color:var(--accent); }

/* Универсальный выбор из списка */
.picker{
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  padding:10px; display:flex; flex-direction:column; gap:10px;
}
.picker-search{
  padding:8px 12px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); border-radius:9px;
  font:inherit; font-size:13.5px; outline:none;
  transition:.15s;
}
.picker-search:focus{ border-color:var(--accent); }
.picker-search::placeholder{ color:var(--dim); }

.picker-section{ display:flex; flex-direction:column; gap:6px; }
.picker-section + .picker-section{
  border-top:1px solid var(--line); padding-top:10px;
}
.picker-label{
  font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:var(--dim); font-weight:600;
}
.picker-list{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:4px; max-height:220px; overflow-y:auto;
  padding:2px;
}
.picker-item{
  display:flex; align-items:center; gap:8px;
  font-size:13px; color:var(--text);
  padding:6px 10px; border-radius:8px; cursor:pointer;
  transition:.15s; user-select:none;
  border:1px solid transparent;
}
.picker-item:hover{ background:var(--card2); }
.picker-item.selected{
  background:color-mix(in srgb, var(--accent) 12%, transparent);
  border-color:color-mix(in srgb, var(--accent) 30%, transparent);
}
.picker-item input{ accent-color:var(--accent); cursor:pointer; }
.picker-empty{
  font-size:12.5px; color:var(--dim);
  font-style:italic; padding:6px;
  grid-column:1/-1;
}

/* автокомплит для связей */
.ac{ position:relative; width:100%; }
.ac-input{
  width:100%; padding:8px 11px;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--text); border-radius:9px;
  font:inherit; font-size:13.5px; outline:none;
  transition:.15s;
}
.ac-input:focus{ border-color:var(--accent); }
.ac-list{
  position:absolute; top:calc(100% + 4px); left:0; right:0;
  background:var(--card2); border:1px solid var(--line);
  border-radius:9px; box-shadow:0 8px 24px -8px rgba(0,0,0,.8);
  max-height:220px; overflow-y:auto; z-index:20;
  padding:4px;
}
.ac-list[hidden]{ display:none; }
.ac-item{
  padding:7px 11px; font-size:13.5px; color:var(--text);
  border-radius:7px; cursor:pointer;
}
.ac-item:hover, .ac-item.active{ background:var(--card); }
.ac-empty{
  padding:8px 11px; font-size:12.5px; color:var(--dim); font-style:italic;
}

/* viewport для древа с zoom + pan */
#treeViewport{
  position: relative;
  width: 100%;
  height: calc(100vh - 260px);
  min-height: 480px;
  overflow: hidden;
  background:
    radial-gradient(700px 400px at 50% 50%, rgba(35,48,66,.55), transparent 70%),
    var(--bg2);
  border: 1px solid var(--line);
  border-radius: 18px;
  cursor: grab;
  touch-action: none;
}
#treeViewport.dragging{ cursor: grabbing; }

#treeInner{
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

/* заголовок кластера — теперь абсолютный, поверх полотна */
.tree-cluster-label{
  position:absolute; transform:translateX(-50%);
  z-index:2; white-space:nowrap; pointer-events:none;
}

/* контролы зума */
.tree-zoom{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--bg2); border:1px solid var(--line);
  border-radius:10px; padding:4px 6px;
}
.tree-zoom button{
  background:transparent; border:0; color:var(--dim);
  width:26px; height:26px; border-radius:7px;
  cursor:pointer; font:inherit; font-size:15px;
  line-height:1; padding:0;
  transition:.15s;
}
.tree-zoom button:hover{ color:var(--text); background:var(--card2); }
.tree-zoom span{
  font-size:12px; color:var(--dim); min-width:42px; text-align:center;
  font-variant-numeric:tabular-nums;
}

/* .tree-canvas больше не используется — если где-то остался, нейтрализуем */
.tree-canvas{ all: unset; }

@media (max-width:640px){
  .rel-edit-row{ grid-template-columns:1fr 1fr !important; }
}

@media (max-width:640px){
  .ll-compare-row{ grid-template-columns:110px 1fr 40px; }
  .ll-compare-born{ display:none; }
  .ll-compare-pair{ grid-template-columns:36px 1fr; }
  .ll-compare-pair-diff{ grid-column:1/-1; text-align:left; padding-left:36px; }
}

@media (max-width:640px){
  .ll-compare-row{ grid-template-columns:110px 1fr 40px; }
  .ll-compare-born{ display:none; }
}

  @media (max-width:640px){
    .fgrid{grid-template-columns:1fr}
    header,main,.statusbar,.banner{padding-left:16px;padding-right:16px}
    .statusbar{top:auto; position:static}
    #lifelines{ --ll-label-w:180px; }
    .ll-row .ll-flags{ display:none; }
  }
</style>

<header>
  <div class="brand">
    <div class="logo">◈</div>
    <div>
      <h1 id="worldTitle">…</h1>
      <p id="worldSub">…</p>
    </div>
  </div>
  <nav class="tabs">
    <button data-tab="cards" class="active">Картотека</button>
    <button data-tab="locations">Локации</button>
    <button data-tab="timeline">Хроника</button>

</header>

<div class="statusbar">

  </span>

  <span class="spacer"></span>
  <button id="btnEdit">✎ Режим правки</button>

<div class="banner" id="banner" hidden></div>

<main>
  <section id="tab-cards" class="tab active">
    <div class="toolbar">
      <input id="search" placeholder="Поиск: имя, роль, тег…">
      <div class="chips" id="factions"></div>
      <div class="chips" id="countryFilter"></div>
      <button class="btn-add" id="btnAddChar" hidden>+ Персонаж</button>
    </div>
    <div class="grid" id="cardGrid"></div>
  </section>

    <section id="tab-locations" class="tab">
    <div class="toolbar">
      <input id="locSearch" placeholder="Поиск: название, тип, описание…">
      <div class="chips" id="locCountries"></div>
      <button class="btn-add" id="btnAddLocation" hidden>+ Локация</button>
    </div>
    <div class="loc-grid" id="locGrid"></div>
  </section>

<script>
/* ============================================================
   Константы
   ============================================================ */
const DRAFT_KEY = 'svod_draft_v1';
const REL_COLORS = {
  "родитель":"#e0a458", "ребёнок":"#e0a458",
  "супруг":"#e0709a",
  "брат":"#c9a45f", "брат / сестра":"#c9a45f",
  "семья":"#e0a458", "любовь":"#e0709a", "дружба":"#5fc9a8",
  "вражда":"#e2574c", "долг":"#6aa8e0", "тайна":"#a98ce0", "союз":"#8fa3b8"
};

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const byId = id => DB.characters.find(c => c.id === id);
const initials = n => String(n || '?').split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase() || '?';

/* Цвет текущего клана — для карточек, модалок, бейджей */
const clanColor = c => {
  const key = c.faction;
  if (!key) return "#8b98ab";
  if (DB.families){
    const byId   = DB.families.find(f => f.id === key);
    if (byId && byId.color) return byId.color;
    const byName = DB.families.find(f => f.name === key);
    if (byName && byName.color) return byName.color;
  }
  return DB.factions[key] || "#8b98ab";
};

function clanName(c){
  if (!c.faction) return 'Вне кланов';
  if (DB.families){
    const f = DB.families.find(x => x.id === c.faction || x.name === c.faction);
    if (f) return f.name;
  }
  return c.faction;
}

/* ============================================================
   Автоматическая подпись для родственных связей по полу
   ============================================================ */
function displayRelLabel(r, viewingId){
  const otherId = r.a === viewingId ? r.b : r.a;
  const other = byId(otherId);

  /* если у второго нет пола — оставляем подпись как есть */
  if (!other || !other.gender) return r.label || '';

  const g = other.gender;

  if (r.t === 'брат'){
    return g === 'м' ? 'Брат' : 'Сестра';
  }
  if (r.t === 'родитель'){
    const otherIsParent = r.a === otherId;   /* other — родитель viewing? */
    if (otherIsParent){
      return g === 'м' ? 'Отец' : 'Мать';
    } else {
      return g === 'м' ? 'Сын' : 'Дочь';
    }
  }
  if (r.t === 'супруг'){
    return g === 'м' ? 'Муж' : 'Жена';
  }
  return r.label || r.t;
}

/* Цвет родного клана — для древа */
const bloodColor = c => {
  if (!c.bornInto || !DB.families) return "#8b98ab";
  const fam = DB.families.find(f => f.id === c.bornInto);
  return (fam && fam.color) || "#8b98ab";
};

/* ============================================================
   Читаемость текста на цветном фоне
   ============================================================ */
function isLightColor(hex){
  if (!hex || typeof hex !== 'string') return false;
  const c = hex.replace('#', '').trim();
  if (c.length !== 6) return false;
  const r = parseInt(c.slice(0, 2), 16);
  const g = parseInt(c.slice(2, 4), 16);
  const b = parseInt(c.slice(4, 6), 16);
  if ([r,g,b].some(x => isNaN(x))) return false;
  /* перцептивная яркость (WCAG-подобная) */
  const L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return L > 0.62;
}

/* Возвращает цвет текста, читаемый на фоне указанного цвета */
function textOnColor(hex){
  return isLightColor(hex) ? '#0b0f15' : '#FFFFF0';
}

/* Возвращает цвет текста по clanName персонажа */
function textOnClan(c){
  const key = c.faction;
  if (!key) return '#FFFFF0';
  let color = '#8b98ab';
  if (DB.families){
    const f = DB.families.find(x => x.id === key || x.name === key);
    if (f && f.color) color = f.color;
  }
  return textOnColor(color);
}

/* Читаемое имя клана — вместо латинского id */
function clanName(c){
  if (!c.faction) return 'Вне кланов';
  if (DB.families){
    const f = DB.families.find(x => x.id === c.faction || x.name === c.faction);
    if (f) return f.name;
  }
  return c.faction;
}

/* Общая — используется по умолчанию как раньше */
const factionColor = c => clanColor(c);
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function avatarHTML(c, extraClass = '', colorOverride = null){
  const col = colorOverride || factionColor(c);
  const photo = c.photo ? `<img src="${esc(c.photo)}" alt="" onerror="this.remove()">` : '';
  const cls = 'avatar' + (c.photo ? ' has-photo' : '') + (extraClass ? ' ' + extraClass : '');
  return `<div class="${cls}" style="--c:${col}">${photo || initials(c.name)}</div>`;
}

/* ============================================================
   Страны
   ============================================================ */
const countryOf = code => (DB.countries || {})[code] || { name: code, flag: '🏳', color: '#8b98ab' };

const locTypeName = t => (DB.locationTypes || {})[t] || t || 'Место';
function locationsForChar(charId){
  return (DB.locations || []).filter(l => (l.residents || []).includes(charId));
}
function eventsAtLocation(locId){
  return DB.events.filter(e => e.location === locId);
}
function residentsLabel(n){
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return `${n} житель`;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return `${n} жителя`;
  return `${n} жителей`;
}

/* ============================================================
   Универсальный выбор из списка с поиском и «выбрано сверху»
   ============================================================ */
function setupPicker(rootEl, allItems, initialSelected){
  /* allItems: [{id, name}] */
  const selected = new Set(initialSelected || []);
  let search = '';

  rootEl.innerHTML = `
    <input type="search" class="picker-search" placeholder="Найти по имени…">
    <div class="picker-section chosen" hidden>
      <div class="picker-label">Выбрано (<span class="chosen-count">0</span>)</div>
      <div class="picker-list chosen-list"></div>
    </div>
    <div class="picker-section">
      <div class="picker-label">Остальные</div>
      <div class="picker-list all-list"></div>
    </div>
  `;

  const searchInput   = rootEl.querySelector('.picker-search');
  const chosenSection = rootEl.querySelector('.picker-section.chosen');
  const chosenList    = rootEl.querySelector('.chosen-list');
  const allList       = rootEl.querySelector('.all-list');
  const chosenCount   = rootEl.querySelector('.chosen-count');

  function matches(item){
    if (!search) return true;
    return item.name.toLowerCase().includes(search.toLowerCase());
  }

  function makeItem(item){
    const el = document.createElement('label');
    el.className = 'picker-item';
    if (selected.has(item.id)) el.classList.add('selected');
    el.innerHTML = `
      <input type="checkbox" ${selected.has(item.id) ? 'checked' : ''}>
      <span>${esc(item.name)}</span>
    `;
    const cb = el.querySelector('input');
    cb.onchange = () => {
      if (cb.checked) selected.add(item.id);
      else selected.delete(item.id);
      render();
    };
    return el;
  }

  function render(){
    const chosenItems = allItems.filter(i => selected.has(i.id));
    chosenCount.textContent = chosenItems.length;
    chosenSection.hidden = chosenItems.length === 0;

    chosenList.innerHTML = '';
    chosenItems.forEach(item => chosenList.appendChild(makeItem(item)));

    const filtered = allItems.filter(i => !selected.has(i.id) && matches(i));
    allList.innerHTML = '';
    if (!filtered.length){
      const empty = document.createElement('div');
      empty.className = 'picker-empty';
      empty.textContent = search
        ? 'Ничего не найдено'
        : (allItems.length === 0 ? 'Список пуст' : 'Все уже выбраны');
      allList.appendChild(empty);
    } else {
      filtered.forEach(item => allList.appendChild(makeItem(item)));
    }
  }

  searchInput.oninput = e => {
    search = e.target.value.trim();
    render();
  };

  render();

  return {
    getSelected: () => [...selected],
    /* на случай программного изменения извне */
    refresh: render
  };
}

/* ============================================================
   Проверка целостности
   ============================================================ */
function checkIntegrity(){
  const issues = [];
  const charIds = new Map();
  const locIds  = new Map();
  const famIds  = new Map();

  /* --- дубли и пустые id --- */
  (DB.characters || []).forEach((c, i) => {
    if (!c.id) issues.push({ sev:'error', msg:`Персонаж №${i+1} без id (имя: «${c.name || '?'}»)` });
    else if (charIds.has(c.id)) issues.push({ sev:'error', msg:`Дубль id персонажа «${c.id}»: «${charIds.get(c.id)}» и «${c.name}»` });
    else charIds.set(c.id, c.name);
  });

  (DB.locations || []).forEach((l, i) => {
    if (!l.id) issues.push({ sev:'error', msg:`Локация №${i+1} без id (название: «${l.name || '?'}»)` });
    else if (locIds.has(l.id)) issues.push({ sev:'error', msg:`Дубль id локации «${l.id}»: «${locIds.get(l.id)}» и «${l.name}»` });
    else locIds.set(l.id, l.name);
  });

  (DB.families || []).forEach((f, i) => {
    if (!f.id) issues.push({ sev:'error', msg:`Семья №${i+1} без id (название: «${f.name || '?'}»)` });
    else if (famIds.has(f.id)) issues.push({ sev:'error', msg:`Дубль id семьи «${f.id}»` });
    else famIds.set(f.id, f.name);
  });

  /* --- битые ссылки --- */
  (DB.characters || []).forEach(c => {
    if (c.bornInto && !famIds.has(c.bornInto)){
      issues.push({ sev:'warn', msg:`«${c.name}»: bornInto = «${c.bornInto}» — такой семьи нет` });
    }
  });

  (DB.relations || []).forEach((r, i) => {
    if (!charIds.has(r.a)) issues.push({ sev:'warn', msg:`Связь №${i+1}: персонаж «${r.a}» не найден` });
    if (!charIds.has(r.b)) issues.push({ sev:'warn', msg:`Связь №${i+1}: персонаж «${r.b}» не найден` });
  });

  (DB.events || []).forEach(e => {
    (e.cast || []).forEach(id => {
      if (!charIds.has(id)) issues.push({ sev:'warn', msg:`Событие «${e.title}»: участник «${id}» не найден` });
    });
    if (e.location && !locIds.has(e.location)){
      issues.push({ sev:'warn', msg:`Событие «${e.title}»: локация «${e.location}» не найдена` });
    }
  });

  (DB.locations || []).forEach(l => {
    (l.residents || []).forEach(id => {
      if (!charIds.has(id)) issues.push({ sev:'warn', msg:`Локация «${l.name}»: житель «${id}» не найден` });
    });
    if (l.parent && !locIds.has(l.parent)){
      issues.push({ sev:'warn', msg:`Локация «${l.name}»: родитель «${l.parent}» не найден` });
    }
  });

  return issues;
}

function showIntegrityReport(){
  const issues = checkIntegrity();

  if (!issues.length){
    $('#formSheet').innerHTML = `
      <button class="close" onclick="closeForm()">✕</button>
      <h2 style="margin-top:0">Проверка целостности</h2>
      <div style="padding:20px;border-radius:12px;margin-top:16px;
        background:rgba(95,201,168,.08);border:1px solid rgba(95,201,168,.3);
        color:#a8e5cc;font-size:14px;text-align:center">
        ✓ Всё чисто. Ни дублей, ни битых ссылок.
      </div>
      <div class="form-actions"><button type="button" onclick="closeForm()">Закрыть</button></div>
    `;
    $('#formModal').classList.add('on');
    return;
  }

  const errs  = issues.filter(i => i.sev === 'error').length;
  const warns = issues.filter(i => i.sev === 'warn').length;

  $('#formSheet').innerHTML = `
    <button class="close" onclick="closeForm()">✕</button>
    <h2 style="margin-top:0">Проверка целостности</h2>
    <p style="color:var(--dim);font-size:13px;margin:6px 0 0">
      Найдено проблем: <b style="color:var(--text)">${issues.length}</b>
      ${errs ? `· <span style="color:var(--danger)">критичных: ${errs}</span>` : ''}
      ${warns ? `· <span style="color:var(--accent)">предупреждений: ${warns}</span>` : ''}
    </p>
    <div style="max-height:60vh;overflow-y:auto;margin-top:16px;display:flex;flex-direction:column;gap:6px">
      ${issues.map(i => `
        <div style="padding:9px 14px;border-radius:10px;font-size:13px;
          background:${i.sev === 'error' ? 'rgba(226,87,76,.1)' : 'rgba(224,164,88,.08)'};
          border:1px solid ${i.sev === 'error' ? 'rgba(226,87,76,.3)' : 'rgba(224,164,88,.25)'};
          color:${i.sev === 'error' ? '#e8a0a0' : '#e5c79a'}">
          ${i.sev === 'error' ? '⚠' : '·'} ${esc(i.msg)}
        </div>
      `).join('')}
    </div>
    <div class="form-actions"><button type="button" onclick="closeForm()">Закрыть</button></div>
  `;
  $('#formModal').classList.add('on');
}

function flagsHTML(codes){
  if (!codes || !codes.length) return '';
  const items = codes.map((code, i) => {
    const co = countryOf(code);
    const isLast = i === codes.length - 1;
    const cls = 'fl' + (isLast ? ' last' : '');
    return `<span class="${cls}" title="${esc(co.name)}">
      <img src="https://flagcdn.com/w40/${esc(code)}.png" alt="${esc(code.toUpperCase())}" loading="lazy">
    </span>`;
  }).join('');
  return `<span class="flags">${items}</span>`;
}

/* ============================================================
   Возраст
   ============================================================ */
function ageLabel(c, year){
  if (c.born == null) return { text:'?', cls:'' };
  if (c.born > year) return { text:'не род.', cls:'unborn' };
  if (c.died && c.died <= year){
    return { text:'†' + (c.died - c.born), cls:'dead' };
  }
  return { text: String(year - c.born), cls:'' };
}

/* ============================================================
   Состояние
   ============================================================ */
let DB = null;
let editMode = false;
let draftExists = false;
let activeFaction = 'Все';
let activeCountry = 'Все';
let llMode = 'events';
const LL_WIDTH_KEY = 'svod_ll_label_w';
let compareIds = new Set();
let llPxPerYear = 22;
let llCountryFilter = 'Все';
let viewYear = 1252;
let bloodOnly = false;
let activeLocCountry = 'Все';

/* ============================================================
   Загрузка данных
   ============================================================ */
async function boot(){
  let base = null;
  let rawText = null;

  try {
    const r = await fetch('./data.json', { cache: 'no-store' });
    if (!r.ok){
      showBanner(
        `Файл <b>data.json</b> не найден. Проверь, что он лежит рядом с <code>index.html</code>.`,
        []
      );
      $('#srcInfo').className = 'src fail';
      $('#srcInfo').innerHTML = 'источник: <b>не найден</b>';
      return;
    }
    rawText = await r.text();
  } catch(e){
    showBanner(
      'Не удалось прочитать data.json. Скорее всего, страница открыта как файл (file://). ' +
      'Запусти локальный сервер: <code>python -m http.server</code> — и открой http://localhost:8000',
      []
    );
    $('#srcInfo').className = 'src fail';
    $('#srcInfo').innerHTML = 'источник: <b>не загружен</b>';
    return;
  }

  try {
    base = JSON.parse(rawText);
  } catch(err){
    showJsonError(err, rawText);
    return;
  }

  const savedYear = localStorage.getItem(DRAFT_KEY + '_year');
  if (savedYear) viewYear = +savedYear;

  if (base && base.meta && base.meta.currentYear != null){
    window.__fileCurrentYear = base.meta.currentYear;
  }

  const draftRaw = localStorage.getItem(DRAFT_KEY);
  if (draftRaw){
    try {
      const draft = JSON.parse(draftRaw);
      if (JSON.stringify(draft) === JSON.stringify(base)){
        localStorage.removeItem(DRAFT_KEY);
      } else {
        DB = draft;
        draftExists = true;
        $('#srcInfo').className = 'src draft';
        $('#srcInfo').innerHTML = 'источник: <b>черновик</b> (изменения не в файле)';
        showBanner(
          'Загружен черновик из этого браузера — в нём есть правки, которых нет в data.json.',
          [
            { label:'Скачать как data.json', fn: saveFile, primary:true },
            { label:'Отбросить черновик', fn: discardDraft }
          ]
        );
        $('#btnDiscard').hidden = false;
        afterLoad();
        return;
      }
    } catch(e){ localStorage.removeItem(DRAFT_KEY); }
  }

  DB = base;
  $('#srcInfo').innerHTML = 'источник: <b>data.json</b>';
  afterLoad();
}

function afterLoad(){
  $('#worldTitle').textContent = DB.meta?.title || 'Картотека';
  $('#worldSub').textContent   = DB.meta?.subtitle || '';
  document.title = (DB.meta?.title || 'Картотека') + ' — картотека';

  if (viewYear == null){
    const evYears = (DB.events || []).map(e => e.year);
    viewYear = DB.meta?.currentYear
      || (evYears.length ? Math.max(...evYears) : 100);
  }
  if (!DB.countries) DB.countries = {};
  if (!DB.families) DB.families = [];
  if (!DB.locations) DB.locations = [];
  if (!DB.locationTypes) DB.locationTypes = {};
  if (!DB.events) DB.events = [];
  if (!DB.relations) DB.relations = [];

  renderAll();
  renderYearChip();

    /* автопроверка id — показываем баннер, только если есть критические ошибки */
  const criticalIssues = checkIntegrity().filter(i => i.sev === 'error');
  if (criticalIssues.length){
    showBanner(
      `⚠ Найдено <b>${criticalIssues.length}</b> критичных проблем с id. ` +
      `Это может привести к тому, что часть данных потеряется или отобразится неверно. ` +
      `Нажмите «Показать», чтобы увидеть подробности.`,
      [{ label: 'Показать', fn: showIntegrityReport }]
    );
  }
}

/* ============================================================
   Персистентность
   ============================================================ */
function touch(){
  localStorage.setItem(DRAFT_KEY, JSON.stringify(DB));
  if (!draftExists){
    draftExists = true;
    $('#btnDiscard').hidden = false;
    $('#srcInfo').className = 'src draft';
    $('#srcInfo').innerHTML = 'источник: <b>черновик</b> (изменения не в файле)';
  }
}

function saveFile(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showBanner(
    'Файл скачан. Положи его рядом с index.html (заменив старый), затем нажми «Отбросить черновик».',
    []
  );
}

function discardDraft(){
  localStorage.removeItem(DRAFT_KEY);
  draftExists = false;
  $('#btnDiscard').hidden = true;
  location.reload();
}

function showBanner(html, buttons){
  const b = $('#banner');
  b.innerHTML = `<div style="flex:1">${html}</div>` +
    buttons.map((x,i) => `<button data-i="${i}">${esc(x.label)}</button>`).join('');
  b.hidden = false;
  buttons.forEach((x,i) => b.querySelector(`[data-i="${i}"]`).onclick = () => { x.fn(); });
}

/* ============================================================
   Понятная ошибка, если data.json сломан
   ============================================================ */
function showJsonError(err, rawText){
  const msg = String(err && err.message || err);

  /* вытаскиваем позицию и номер строки из сообщения */
  const posMatch = msg.match(/position\s+(\d+)/i);
  const lineColMatch = msg.match(/line\s+(\d+)\s+column\s+(\d+)/i);

  let position = posMatch ? +posMatch[1] : null;
  let line = lineColMatch ? +lineColMatch[1] : null;
  let column = lineColMatch ? +lineColMatch[2] : null;

  /* если есть позиция, но нет номера строки — считаем вручную */
  if (position != null && line == null && rawText){
    let l = 1, c = 1;
    for (let i = 0; i < position && i < rawText.length; i++){
      if (rawText[i] === '\n'){ l++; c = 1; } else c++;
    }
    line = l;
    column = c;
  }

  /* контекст — несколько строк вокруг ошибки */
  let contextHTML = '';
  if (line != null && rawText){
    const lines = rawText.split('\n');
    const from = Math.max(0, line - 3);
    const to = Math.min(lines.length - 1, line + 2);
    const esc4 = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    contextHTML = `<div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;background:#0b0f15;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;overflow-x:auto;white-space:pre">`;
    for (let i = from; i <= to; i++){
      const isErr = i === line - 1;
      const num = String(i + 1).padStart(4, ' ');
      const text = esc4(lines[i] || '');
      contextHTML += `<div style="color:${isErr ? '#e2574c' : '#8593a6'};${isErr ? 'background:rgba(226,87,76,.08);border-radius:3px' : ''}">`
        + `<span style="color:${isErr ? '#e2574c' : '#4a5869'}">${num} │ </span>${text}</div>`;
    }
    contextHTML += `</div>`;
  }

  const hints = [
    'Запятые: <b>между</b> элементами — есть, <b>после последнего</b> — нет',
    'Кавычки только прямые двойные <code>"</code>, не «ёлочки» и не одинарные',
    'Числа (<code>born</code>, <code>died</code>, <code>year</code>) — без кавычек',
    'Открой файл в VS Code, нажми <code>Ctrl + Shift + P</code> → введи <code>Format Document</code> → Enter. Редактор покажет точное место ошибки'
  ];

  const location = line != null
    ? `Строка <b>${line}</b>${column ? `, колонка <b>${column}</b>` : ''}`
    : 'Точное место не определено';

  const b = $('#banner');
  b.classList.add('wide');
  b.innerHTML = `
    <div style="font-size:14px;margin-bottom:6px">
      <b style="color:var(--danger)">⚠ Ошибка в data.json</b> — ${location}
    </div>
    <div style="color:var(--dim);font-size:12.5px;margin-bottom:4px">
      ${esc(msg)}
    </div>
    ${contextHTML}
    <div style="margin-top:14px;font-size:12.5px;line-height:1.8">
      <b>Что проверить:</b><br>
      ${hints.map(h => '• ' + h).join('<br>')}
    </div>
  `;
  b.hidden = false;

  $('#srcInfo').className = 'src fail';
  $('#srcInfo').innerHTML = 'источник: <b>ошибка в data.json</b>';
}

/* ---------- фракции ---------- */
function renderFactions(){  
    const list = ['Все', ...new Set(DB.characters.map(c => clanName(c)).filter(Boolean))];
  if (!list.includes(activeFaction)) activeFaction = 'Все';
  $('#factions').innerHTML = list.map(f =>
    `<div class="chip ${f === activeFaction ? 'on' : ''}" data-f="${esc(f)}">${esc(f)}</div>`
  ).join('');
  $$('#factions .chip').forEach(ch => ch.onclick = () => {
    activeFaction = ch.dataset.f; renderFactions(); renderCards();
  });
}

/* ---------- фильтр стран ---------- */
function renderCountries(){
  const used = [...new Set(DB.characters.flatMap(c => c.countries || []))];
  if (!used.length){ $('#countryFilter').innerHTML = ''; return; }
  const ordered = Object.keys(DB.countries || {}).filter(k => used.includes(k));
  const list = ['Все', ...ordered];
  if (!list.includes(activeCountry)) activeCountry = 'Все';
    $('#countryFilter').innerHTML = list.map(code => {
    const inner = code === 'Все'
      ? 'Все страны'
      : `<img class="chip-flag" src="https://flagcdn.com/w40/${esc(code)}.png">${esc(countryOf(code).name)}`;
    return `<div class="chip ${code === activeCountry ? 'on' : ''}" data-c="${esc(code)}">${inner}</div>`;
  }).join('');
  $$('#countryFilter .chip').forEach(ch => ch.onclick = () => {
    activeCountry = ch.dataset.c;
    renderCountries(); renderCards();
  });
}

/* ---------- карточки ---------- */
function renderCards(){
  const q = $('#search').value.trim().toLowerCase();
  const list = DB.characters.filter(c => {
        if (activeFaction !== 'Все' && clanName(c) !== activeFaction) return false;
    if (activeCountry !== 'Все' && !(c.countries || []).includes(activeCountry)) return false;
    if (!q) return true;
    return (c.name || '').toLowerCase().includes(q);
  });

  if (!list.length){ $('#cardGrid').innerHTML = `<p class="empty">Никого не нашлось.</p>`; return; }

  $('#cardGrid').innerHTML = list.map(c => {
    const col = factionColor(c);
    const age = ageLabel(c, viewYear);
        const life = c.born != null ? `${c.born}${c.died != null ? '–' + c.died : ''}` : '';
    return `<article class="card" data-id="${c.id}" style="--c:${col}">
      ${editMode ? `<div class="card-actions">
        <button class="edit" data-act="edit" title="Редактировать">✎</button>
        <button class="del" data-act="del" title="Удалить">✕</button>
      </div>` : ''}
      <div class="card-top">
        ${avatarHTML(c)}
        <div><h3>${esc(c.name)}</h3><div class="alias">${esc(c.alias)}</div></div>
      </div>
      <p class="tagline">${esc(c.tagline)}</p>
      <div class="card-meta">
                <span class="badge" style="color:${textOnClan(c)}">${esc(clanName(c))}</span>
        ${c.countries?.length ? `<span class="badge ghost">${flagsHTML(c.countries)}</span>` : ''}
        ${life ? `<span class="badge ghost">${life}</span>` : ''}
        ${c.born != null ? `<span class="badge ghost">${age.text}</span>` : ''}
      </div>
    </article>`;
  }).join('');

  $$('#cardGrid .card').forEach(el => {
    el.onclick = ev => {
      const act = ev.target.dataset?.act;
      const id = el.dataset.id;
      if (act === 'edit'){ ev.stopPropagation(); openCharForm(id); return; }
      if (act === 'del'){ ev.stopPropagation(); confirmDeleteChar(id); return; }
      openChar(id);
    };
  });
}
$('#search').oninput = renderCards;

/* ---------- локации ---------- */
function renderLocCountries(){
  const used = [...new Set((DB.locations || []).map(l => l.country).filter(Boolean))];
  if (!used.length){ $('#locCountries').innerHTML = ''; return; }
  const ordered = Object.keys(DB.countries || {}).filter(k => used.includes(k));
  const list = ['Все', ...ordered];
  if (!list.includes(activeLocCountry)) activeLocCountry = 'Все';
  $('#locCountries').innerHTML = list.map(code => {
    const inner = code === 'Все'
      ? 'Все страны'
      : `<img class="chip-flag" src="https://flagcdn.com/w40/${esc(code)}.png">${esc(countryOf(code).name)}`;
    return `<div class="chip ${code === activeLocCountry ? 'on' : ''}" data-c="${esc(code)}">${inner}</div>`;
  }).join('');
  $$('#locCountries .chip').forEach(ch => ch.onclick = () => {
    activeLocCountry = ch.dataset.c;
    renderLocCountries(); renderLocations();
  });
}

function renderLocations(){
  const list0 = DB.locations || [];
  const q = ($('#locSearch').value || '').trim().toLowerCase();

  const list = list0.filter(l => {
    if (activeLocCountry !== 'Все' && l.country !== activeLocCountry) return false;
    if (!q) return true;
    return [l.name, l.tagline, l.description, locTypeName(l.type), ...(l.tags || [])]
      .join(' ').toLowerCase().includes(q);
  });

  if (!list.length){
    $('#locGrid').innerHTML = `<p class="empty">${list0.length ? 'Ничего не нашлось.' : 'Локаций пока нет. Включите режим правки и добавьте первую.'}</p>`;
    return;
  }

  $('#locGrid').innerHTML = list.map(l => {
    const residents = (l.residents || []).length;
    const events = eventsAtLocation(l.id).length;
    const flag = l.country ? `<img class="loc-flag" src="https://flagcdn.com/w40/${esc(l.country)}.png" title="${esc(countryOf(l.country).name)}">` : '';
    const photo = l.image
      ? `<img src="${esc(l.image)}" loading="lazy" onerror="this.remove()">`
      : locTypeName(l.type);
    return `<article class="loc-card" data-id="${l.id}">
      ${editMode ? `<div class="card-actions">
        <button class="edit" data-act="edit" title="Редактировать">✎</button>
        <button class="del" data-act="del" title="Удалить">✕</button>
      </div>` : ''}
      <div class="loc-photo">
        ${photo}
        ${flag}
        <span class="loc-type-badge">${esc(locTypeName(l.type))}</span>
      </div>
      <div class="loc-body">
        <h3>${esc(l.name)}</h3>
        <p class="loc-tagline">${esc(l.tagline || '')}</p>
        <div class="loc-meta">
          ${residents ? `<span class="count">${residentsLabel(residents)}</span>` : ''}
          ${events ? `<span class="count">${events} ${events === 1 ? 'событие' : events < 5 ? 'события' : 'событий'}</span>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');

  $$('#locGrid .loc-card').forEach(el => {
    el.onclick = ev => {
      const act = ev.target.dataset?.act;
      const id = el.dataset.id;
      if (act === 'edit'){ ev.stopPropagation(); openLocationForm(id); return; }
      if (act === 'del'){ ev.stopPropagation(); confirmDeleteLocation(id); return; }
      openLocation(id);
    };
  });
}
$('#locSearch').oninput = renderLocations;

/* ---------- хроника (события) ---------- */
function renderTimeline(){
  const evs = [...DB.events].sort((a,b) => a.year - b.year);
  $('#timeline').innerHTML = evs.length ? evs.map(e => {
    const realIdx = DB.events.indexOf(e);
    return `<div class="ev" data-i="${realIdx}">
      ${editMode ? `<div class="ev-actions">
        <button data-act="edit">✎</button>
        <button class="del" data-act="del">✕</button>
      </div>` : ''}
      <div class="ev-year">${esc(e.year)} г. от Раскола</div>
      <h3>${esc(e.title)}</h3>
      <p>${esc(e.text)}</p>
      <div class="cast">
        ${(e.cast || []).map(id => { const c = byId(id); return c
          ? `<span data-id="${id}">${esc(c.name)}</span>` : ''; }).join('')}
      </div>
    </div>`;
  }).join('') : `<p class="empty">Событий пока нет.</p>`;

  $$('#timeline .cast span').forEach(s => s.onclick = () => openChar(s.dataset.id));
  $$('#timeline .ev').forEach(el => {
    el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = ev => {
      ev.stopPropagation();
      const i = +el.dataset.i;
      if (btn.dataset.act === 'edit') openEventForm(i);
      else { DB.events.splice(i, 1); touch(); renderTimeline(); }
    });
  });
}

/* ============================================================
   Карточка персонажа
   ============================================================ */

  const c = byId(id); if (!c) return;
  const col = factionColor(c);

  const rels = DB.relations.filter(r => r.a === id || r.b === id).map(r => {
    const isA = r.a === id;
    const otherId = isA ? r.b : r.a;
    const o = byId(otherId);

    let t = r.t;
    if (r.t === 'родитель'){
      t = isA ? 'родитель' : 'ребёнок';
    } else if (r.t === 'брат'){
      t = 'брат / сестра';
    }

    /* подпись считается автоматически по полу второго */
    const label = displayRelLabel(r, id);

    return { o, t, label };
  }).filter(r => r.o);

  const evs = DB.events.filter(e => (e.cast || []).includes(id)).sort((a,b) => a.year - b.year);
  const age = ageLabel(c, viewYear);
  const life = c.born != null ? `${c.born}${c.died != null ? '–' + c.died : ''}` : '';

  $('#sheet').dataset.charId = id;
  $('#sheet').style.setProperty('--c', col);
  $('#sheet').innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    <div class="sheet-head">
      ${avatarHTML(c)}
      <div><h2>${esc(c.name)}</h2><div class="alias">${esc(c.alias)}</div></div>
    </div>

        <div class="meta">
      <div><b>Клан</b><span>${esc(clanName(c))}</span></div>
      ${(() => {
        const fam = c.bornInto ? (DB.families || []).find(f => f.id === c.bornInto) : null;
        if (!fam || fam.name === clanName(c)) return '';
        return `<div><b>Родной клан</b><span style="color:${esc(fam.color)}">${esc(fam.name)}</span></div>`;
      })()}
      <div><b>Профессия</b><span>${esc(c.role)}</span></div>
      <div><b>Возраст · ${viewYear}</b><span>${age.text}${life ? ` <span style="color:var(--dim);font-size:12px">(${life})</span>` : ''}</span></div>
      <div><b>Страны</b><span>${flagsHTML(c.countries) || '—'}</span></div>
      <div><b>Статус</b><span>${esc(c.status)}</span></div>
    </div>

    ${c.quote ? `<blockquote class="quote">«${esc(c.quote)}»</blockquote>` : ''}
    <p class="bio">${esc(c.bio)}</p>

    ${c.traits && Object.keys(c.traits).length ? `<h3>Черты</h3>
    <div class="traits">
      ${Object.entries(c.traits).map(([k,v]) => `
        <div class="trait"><span>${esc(k)}</span>
          <div class="bar"><i style="width:${Math.max(0,Math.min(100, v*10))}%"></i></div>
          <b>${esc(v)}</b></div>`).join('')}
    </div>` : ''}

    <h3>Связи · ${rels.length}</h3>
    <div class="rel">
      ${rels.length ? rels.map((r, i) => `
        <div class="row clickable" data-rid="${i}">
          <span class="dot" style="background:${REL_COLORS[r.t] || '#8fa3b8'}"></span>
          <span>${esc(r.o.name)}</span>
          <span style="color:var(--dim);font-size:12px">— ${esc(r.label)}</span>
          <span class="rt" style="color:${REL_COLORS[r.t] || '#8fa3b8'}">${esc(r.t)}</span>
        </div>`).join('') : `<p class="empty">Связей пока нет.</p>`}
    </div>

        ${(() => {
      const locs = locationsForChar(id);
      if (!locs.length) return '';
      return `<h3>Локации · ${locs.length}</h3>
      <div class="residents">
        ${locs.map(l => `<button data-loc="${l.id}">
          <span class="mini-avatar" style="--c:${l.country ? countryOf(l.country).color : '#8b98ab'}">
            ${l.image ? `<img src="${esc(l.image)}" onerror="this.remove()">` : '📍'}
          </span>
          <span>${esc(l.name)}</span>
        </button>`).join('')}
      </div>`;
    })()}

    <h3>В хронике · ${evs.length}</h3>
    <div class="rel">
      ${evs.length ? evs.map(e => `
        <div class="row clickable" data-ev="1">
          <span style="color:var(--accent);font-size:12px;font-weight:700;min-width:38px">${esc(e.year)}</span>
          <span>${esc(e.title)}</span>
        </div>`).join('') : `<p class="empty">Не упоминается.</p>`}
    </div>

       ${c.secret ? `<h3>Особенности</h3>
    <p class="bio">${esc(c.secret)}</p>` : ''}

  $$('#sheet .rel .row.clickable').forEach(row => {
    row.onclick = () => {

      const i = +row.dataset.rid;
      if (rels[i]) openChar(rels[i].o.id);

function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeModal(); closeForm(); }
});

function openLocation(id){
  const l = (DB.locations || []).find(x => x.id === id); if (!l) return;

  const residents = (l.residents || []).map(byId).filter(Boolean);
  const evs = eventsAtLocation(l.id).sort((a,b) => a.year - b.year);

  /* крошки: страна → родитель → ... → текущая */
  const crumbs = [];
  let cur = l;
  while (cur){
    crumbs.unshift(cur);
    cur = cur.parent ? (DB.locations || []).find(x => x.id === cur.parent) : null;
  }
  const breadcrumb = [
    l.country ? `<span style="color:var(--dim)">${countryOf(l.country).flag} ${esc(countryOf(l.country).name)}</span>` : '',
    ...crumbs.map((c, i) => i === crumbs.length - 1
      ? `<span>${esc(c.name)}</span>`
      : `<span class="crumb" data-crumb="${c.id}">${esc(c.name)}</span>`)
  ].filter(Boolean).join(`<span class="sep">›</span>`);

  const photo = l.image
    ? `<img src="${esc(l.image)}" onerror="this.remove()">`
    : locTypeName(l.type);

  $('#sheet').dataset.locId = id;
  $('#sheet').dataset.charId = '';
  $('#sheet').style.setProperty('--c', l.country ? countryOf(l.country).color : '#8b98ab');

  $('#sheet').innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    <div class="loc-sheet-head">
      <div class="loc-sheet-photo">${photo}</div>
      <div class="loc-sheet-head-info">
        <div class="loc-breadcrumb">${breadcrumb}</div>
        <h2>${esc(l.name)}</h2>
        <div class="loc-badges">
          <span class="badge">${esc(locTypeName(l.type))}</span>
          ${(l.tags || []).map(t => `<span class="badge ghost">${esc(t)}</span>`).join('')}
        </div>
      </div>
    </div>

    <p class="bio" style="margin-bottom:20px">${esc(l.description || '')}</p>

    <h3>Жители · ${residents.length}</h3>
    <div class="residents">
      ${residents.length ? residents.map(c => {
        const col = factionColor(c);
        const pic = c.photo
          ? `<img src="${esc(c.photo)}" onerror="this.remove()">`
          : initials(c.name);
        return `<button data-char="${c.id}">
          <span class="mini-avatar" style="--c:${col}">${pic}</span>
          <span>${esc(c.name)}</span>
        </button>`;
      }).join('') : `<p class="empty">Никто не отмечен.</p>`}
    </div>

    <h3>События здесь · ${evs.length}</h3>
    <div class="rel">
      ${evs.length ? evs.map(e => `
        <div class="row clickable" data-ev="1">
          <span style="color:var(--accent);font-size:12px;font-weight:700;min-width:38px">${esc(e.year)}</span>
          <span>${esc(e.title)}</span>
        </div>`).join('') : `<p class="empty">Здесь ещё ничего не произошло.</p>`}
    </div>

        ${l.secret ? `<h3>Особенности</h3>
    <p class="bio">${esc(l.secret)}</p>` : ''}
  `;

  $$('#sheet .residents button').forEach(b => b.onclick = () => openChar(b.dataset.char));
  $$('#sheet .crumb').forEach(c => c.onclick = () => openLocation(c.dataset.crumb));
  $$('#sheet .rel .row.clickable').forEach(row => row.onclick = () => {
    closeModal();
    document.querySelector('[data-tab=timeline]').click();
  });
  
  $('#modal').classList.add('on');
}

function confirmDeleteLocation(id){
  const l = (DB.locations || []).find(x => x.id === id); if (!l) return;
  const evs = eventsAtLocation(id).length;
  const children = (DB.locations || []).filter(x => x.parent === id).length;
  if (!confirm(`Удалить «${l.name}»?\n\nСобытий с этой локацией: ${evs}\nВложенных локаций: ${children}`)) return;
  DB.locations = DB.locations.filter(x => x.id !== id);
  DB.events.forEach(e => { if (e.location === id) delete e.location; });
  DB.locations.forEach(x => { if (x.parent === id) x.parent = null; });
  touch(); renderAll();
}

/* ============================================================
   Форма персонажа

    secret:'', photo:'', born: viewYear, died:null

  const isNew = !id;
  const factions = Object.keys(DB.factions);
  const traitsStr = Object.entries(c.traits || {}).map(([k,v]) => `${k}: ${v}`).join('\n');
  const countryEntries = Object.entries(DB.countries || {});

  $('#formSheet').innerHTML = `
    <button class="close" onclick="closeForm()">✕</button>

      <label>Прозвище<input name="alias" value="${esc(c.alias)}"></label>
      <label>Клан
